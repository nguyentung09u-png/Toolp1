<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Demo Skybox (Sky Dome)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 1. Khởi tạo Scene, Camera, Renderer
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// 2. TẠO SKYBOX / SKY DOME (Vòm trời)
// Dùng một khối cầu khổng lồ bao quanh mọi thứ
const skyGeo = new THREE.SphereGeometry(1000, 32, 32);

// ShaderMaterial để vẽ mây, sao và gradient màu
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, // Lật mặt trong để nhìn từ bên trong ra
  depthWrite: false,
  uniforms: {
    uTime: { value: 0 },
    uTopColor: { value: new THREE.Color(0x0a2a5c) },    // Xanh đậm trên cao
    uBottomColor: { value: new THREE.Color(0x4a7db5) }, // Xanh nhạt chân trời
    uFogColor: { value: new THREE.Color(0x8db3d9) }     // Màu sương mù hòa quyện
  },
  vertexShader: `
    varying vec3 vPos;
    void main() {
      vPos = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uTopColor;
    uniform vec3 uBottomColor;
    uniform vec3 uFogColor;
    varying vec3 vPos;

    // Hàm tạo nhiễu ngẫu nhiên cho mây
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) { 
      vec2 i = floor(p), f = fract(p), u = f*f*(3.0-2.0*f); 
      return mix(mix(hash(i), hash(i+vec2(1,0)), u.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y); 
    }

    void main() {
      vec3 dir = normalize(vPos);
      
      // 1. Gradient màu nền trời (từ chân trời lên đỉnh)
      float h = clamp(dir.y, 0.0, 1.0);
      vec3 skyColor = mix(uBottomColor, uTopColor, pow(h, 0.6));
      
      // Hòa quyện sương mù ở đường chân trời
      skyColor = mix(uFogColor, skyColor, smoothstep(-0.1, 0.3, dir.y));

      // 2. Tạo các ngôi sao (chỉ hiện ở trên cao)
      if (dir.y > 0.0) {
        vec2 starUv = dir.xz / (dir.y + 0.15) * 160.0;
        float starHash = hash(floor(starUv));
        if (starHash > 0.97) {
          float starBright = smoothstep(0.12, 0.0, length(fract(starUv) - 0.5));
          skyColor += vec3(1.0, 0.95, 0.85) * starBright * 2.0;
        }
      }

      // 3. Tạo mây mờ ảo trôi nhẹ (chỉ ở tầm trung)
      if (dir.y > 0.01) {
        vec2 cloudUv = dir.xz / (dir.y + 0.15) * 1.5 + uTime * 0.02;
        float cloud = noise(cloudUv) * noise(cloudUv * 2.0);
        skyColor = mix(skyColor, vec3(0.9, 0.95, 1.0), smoothstep(0.3, 0.6, cloud) * 0.4 * (1.0 - h));
      }

      gl_FragColor = vec4(skyColor, 1.0);
    }
  `
});

const skyDome = new THREE.Mesh(skyGeo, skyMat);
scene.add(skyDome);

// 3. Xoay camera một chút để thấy sự chuyển động
camera.position.set(0, 0, 0);

// 4. Vòng lặp render
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  
  // Cập nhật thời gian cho mây trôi
  skyMat.uniforms.uTime.value = clock.getElapsedTime();
  
  // Xoay nhẹ camera để cảm nhận không gian
  camera.rotation.y = Math.sin(clock.getElapsedTime() * 0.1) * 0.5;

  renderer.render(scene, camera);
}
animate();

// 5. Xử lý khi resize màn hình
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
