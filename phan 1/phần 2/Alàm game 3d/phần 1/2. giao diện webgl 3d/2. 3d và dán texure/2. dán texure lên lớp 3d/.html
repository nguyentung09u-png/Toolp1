<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>So sánh Texture & Alpha Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: #04060c; }

  #canvas-container { position: fixed; inset: 0; z-index: 1; }
  #canvas-container canvas { display: block; }

  #ui {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    z-index: 20; display: flex; flex-direction: column; gap: 10px;
    align-items: center; width: max-content; max-width: calc(100vw - 24px);
  }

  .toggle-bar {
    display: flex; gap: 6px; padding: 6px; border-radius: 999px;
    background: rgba(10,14,24,.68);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 10px 36px rgba(0,0,0,.42);
  }
  
  .toggle-bar button {
    border: 1px solid rgba(255,255,255,.14); border-radius: 999px;
    background: rgba(255,255,255,.06); color: #cbd5e1;
    font-family: inherit; font-size: 12px; font-weight: 700;
    padding: 9px 16px; cursor: pointer; transition: all .18s;
    white-space: nowrap;
  }
  .toggle-bar button:hover { background: rgba(255,255,255,.14); color: #fff; }
  .toggle-bar button.on {
    background: linear-gradient(135deg, rgba(56,189,248,.9), rgba(139,92,246,.9));
    color: #fff; border-color: transparent;
    box-shadow: 0 2px 14px rgba(56,189,248,.5);
  }

  #status {
    padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 600;
    color: #e2e8f0; text-align: center; background: rgba(10,14,24,.68);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.14); transition: all .3s;
  }

  @media (max-width: 600px) {
    .toggle-bar { flex-wrap: wrap; justify-content: center; }
    .toggle-bar button { padding: 8px 11px; font-size: 11px; }
    #ui { gap: 6px; }
  }
</style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui">
    <div id="status">Đang xem: Texture BẬT · Alpha BẬT (Trông tự nhiên nhất)</div>
    
    <div class="toggle-bar">
      <button id="btn-tex-on" class="on">🖼 Texture: BẬT</button>
      <button id="btn-tex-off">🎨 Texture: TẮT</button>
    </div>
    
    <div class="toggle-bar">
      <button id="btn-alpha-on" class="on">🍃 Alpha Test: BẬT</button>
      <button id="btn-alpha-off">⚪ Alpha Test: TẮT</button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ============ CƠ BẢN: SCENE, CAMERA, RENDERER ============
  const container = document.getElementById('canvas-container');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a2a3a);
  scene.fog = new THREE.FogExp2(0x1a2a3a, 0.02);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6, 5, 10);
  camera.lookAt(0, 1.5, 0);

  // ============ ÁNH SÁNG ============
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
  const sun = new THREE.DirectionalLight(0xffddaa, 1.5);
  sun.position.set(5, 10, 5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  scene.add(sun);

  // ============ HÀM TẠO TEXTURE BẰNG CANVAS ============
  
  // 1. Texture Cỏ (Ground)
  function makeGrassTex() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#3a5a30'; ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2000; i++) {
      ctx.fillStyle = `hsl(${100 + Math.random()*40}, ${40+Math.random()*40}%, ${20+Math.random()*30}%)`;
      ctx.fillRect(Math.random()*256, Math.random()*256, 2, 4 + Math.random()*6);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(10, 10);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // 2. Texture Gỗ (Tường/Nhà)
  function makeWoodTex() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#6b4b34'; ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 50; i++) {
      ctx.strokeStyle = `rgba(40, 20, 10, ${Math.random()*0.4})`;
      ctx.lineWidth = 1 + Math.random() * 3;
      ctx.beginPath(); ctx.moveTo(0, Math.random()*256);
      ctx.bezierCurveTo(80, Math.random()*256, 170, Math.random()*256, 256, Math.random()*256);
      ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // 3. Texture Ngói (Mái nhà)
  function makeRoofTex() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#2a3345'; ctx.fillRect(0, 0, 128, 128);
    for (let y = 0; y < 128; y += 16) {
      for (let x = 0; x < 128; x += 16) {
        ctx.fillStyle = (x+y)%32 === 0 ? '#1f2736' : '#3a475c';
        ctx.fillRect(x, y, 14, 14);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(3, 2);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // 4. Texture Lá (Có độ trong suốt - Alpha)
  function makeLeafTex() {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 256, 256); // Nền trong suốt
    // Vẽ các cụm lá lởm chởm
    for (let i = 0; i < 400; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.5) * 110;
      const x = 128 + Math.cos(ang) * r;
      const y = 128 + Math.sin(ang) * r;
      const size = 8 + Math.random() * 12;
      ctx.fillStyle = `hsl(${100 + Math.random()*30}, 60%, ${30 + Math.random()*30}%)`;
      ctx.beginPath();
      // Vẽ hình chiếc lá (ellipse)
      ctx.ellipse(x, y, size, size * 0.6, Math.random()*Math.PI, 0, Math.PI*2);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const texGrass = makeGrassTex();
  const texWood = makeWoodTex();
  const texRoof = makeRoofTex();
  const texLeaf = makeLeafTex();

  // ============ MẶT ĐẤT ============
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a5a30, roughness: 0.9 });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // ============ NGÔI NHÀ ============
  const houseGroup = new THREE.Group();
  
  // Tường (Dùng gỗ)
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.8 });
  const walls = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 3), wallMat);
  walls.position.y = 1;
  walls.castShadow = true; walls.receiveShadow = true;
  houseGroup.add(walls);

  // Mái (Dùng ngói)
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a3345, roughness: 0.6 });
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.5, 1.5, 4), roofMat);
  roof.position.y = 2.75;
  roof.rotation.y = Math.PI / 4;
  roof.castShadow = true; roof.receiveShadow = true;
  houseGroup.add(roof);
  
  scene.add(houseGroup);

  // ============ CÂY ============
  const treeGroup = new THREE.Group();
  
  // Thân cây
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.9 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 2, 8), trunkMat);
  trunk.position.y = 1;
  trunk.castShadow = true;
  treeGroup.add(trunk);

  // Tán lá (Sẽ dùng Alpha Test ở đây)
  const leafMat = new THREE.MeshStandardMaterial({
    color: 0x3a6a30, roughness: 0.8,
    transparent: true, // Cần transparent để xử lý alpha
    side: THREE.DoubleSide // Thấy được mặt sau của lá
  });
  
  // Tạo tán lá bằng 2 mặt phẳng cắt nhau (Billboard Cross)
  const leafGeo = new THREE.PlaneGeometry(3, 3);
  const leaf1 = new THREE.Mesh(leafGeo, leafMat);
  leaf1.position.y = 2.8;
  leaf1.castShadow = true;
  const leaf2 = new THREE.Mesh(leafGeo, leafMat);
  leaf2.position.y = 2.8;
  leaf2.rotation.y = Math.PI / 2;
  leaf2.castShadow = true;
  
  treeGroup.add(leaf1);
  treeGroup.add(leaf2);
  
  treeGroup.position.set(-2, 0, 0);
  scene.add(treeGroup);

  // ============ LOGIC SO SÁNH ============
  const state = { useTexture: true, useAlpha: true };
  
  const btnTexOn = document.getElementById('btn-tex-on');
  const btnTexOff = document.getElementById('btn-tex-off');
  const btnAlphaOn = document.getElementById('btn-alpha-on');
  const btnAlphaOff = document.getElementById('btn-alpha-off');
  const statusText = document.getElementById('status');

  function updateMaterials() {
    // 1. Cập nhật TEXTURE
    if (state.useTexture) {
      groundMat.map = texGrass; groundMat.color.setHex(0xffffff);
      wallMat.map = texWood; wallMat.color.setHex(0xffffff);
      roofMat.map = texRoof; roofMat.color.setHex(0xffffff);
      trunkMat.map = texWood; trunkMat.color.setHex(0x8a6a50);
      // Nếu bật texture lá thì dùng màu trắng để không bị ám màu
      leafMat.map = texLeaf; leafMat.color.setHex(0xffffff);
    } else {
      groundMat.map = null; groundMat.color.setHex(0x3a5a30);
      wallMat.map = null; wallMat.color.setHex(0xd2b48c);
      roofMat.map = null; roofMat.color.setHex(0x2a3345);
      trunkMat.map = null; trunkMat.color.setHex(0x4a3020);
      leafMat.map = null; leafMat.color.setHex(0x3a6a30);
    }

    // 2. Cập nhật ALPHA TEST
    if (state.useAlpha) {
      leafMat.alphaTest = 0.5; // Cắt bỏ các pixel có độ trong suốt < 0.5
      leafMat.transparent = true; 
    } else {
      leafMat.alphaTest = 0.0; // Không cắt, hiển thị toàn bộ hình vuông
      leafMat.transparent = false; // Tắt transparent để thấy rõ khối đặc (nếu không có map)
    }
    
    // Bắt buộc Three.js cập nhật lại shader
    groundMat.needsUpdate = true;
    wallMat.needsUpdate = true;
    roofMat.needsUpdate = true;
    trunkMat.needsUpdate = true;
    leafMat.needsUpdate = true;

    // Cập nhật UI
    btnTexOn.classList.toggle('on', state.useTexture);
    btnTexOff.classList.toggle('on', !state.useTexture);
    btnAlphaOn.classList.toggle('on', state.useAlpha);
    btnAlphaOff.classList.toggle('on', !state.useAlpha);

    let msg = `Texture: ${state.useTexture ? 'BẬT' : 'TẮT'} · Alpha: ${state.useAlpha ? 'BẬT' : 'TẮT'}`;
    if (!state.useTexture && !state.useAlpha) msg += ' → Trông như đồ chơi nhựa!';
    else if (state.useTexture && state.useAlpha) msg += ' → Trông tự nhiên nhất!';
    else if (state.useTexture && !state.useAlpha) msg += ' → Lá cây bị thành khối vuông!';
    else if (!state.useTexture && state.useAlpha) msg += ' → Lá cây lởm chởm nhưng 1 màu!';
    statusText.textContent = msg;
  }

  btnTexOn.onclick = () => { state.useTexture = true; updateMaterials(); };
  btnTexOff.onclick = () => { state.useTexture = false; updateMaterials(); };
  btnAlphaOn.onclick = () => { state.useAlpha = true; updateMaterials(); };
  btnAlphaOff.onclick = () => { state.useAlpha = false; updateMaterials(); };

  // Khởi tạo trạng thái ban đầu
  updateMaterials();

  // ============ VÒNG LẶP RAF DUY NHẤT ============
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    // Xoay nhẹ góc nhìn để thấy rõ texture 3D
    const t = Date.now() * 0.001;
    treeGroup.rotation.y = Math.sin(t) * 0.2;
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
