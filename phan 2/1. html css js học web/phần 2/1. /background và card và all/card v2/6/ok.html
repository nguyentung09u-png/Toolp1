<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nguyễn Thanh Huy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:      #fdf9f5;
    --blush:      #f5e4e0;
    --blush-2:    #ecd0c9;
    --mint:       #d4e8dc;
    --lavender:   #e0d8ec;
    --ink:        #3a2e30;
    --ink-soft:   #5a4a4c;
    --muted:      #9a8a8c;
    --line:       rgba(58, 46, 48, 0.10);
  }

  html, body {
    min-height: 100%;
    font-family: 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- BACKGROUND: BLUSH RADIAL WASH ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 22% 18%, rgba(245, 228, 224, 0.95), transparent 65%),
      radial-gradient(ellipse 50% 40% at 82% 30%, rgba(224, 216, 236, 0.7), transparent 65%),
      radial-gradient(ellipse 60% 50% at 65% 88%, rgba(212, 232, 220, 0.6), transparent 65%),
      radial-gradient(ellipse 40% 35% at 15% 85%, rgba(236, 208, 201, 0.55), transparent 65%),
      linear-gradient(180deg, #fdf9f5 0%, #faf4f0 100%);
  }
  /* Paper grain rất nhẹ */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.18;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.42  0 0 0 0 0.42  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: multiply;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }

  /* ---------- CARD: SOFT CLOUD BLOB ---------- */
  .card {
    position: relative;
    width: min(380px, 100%);
    padding: 52px 40px 44px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    /* Blob radius không đều — mềm, hữu cơ */
    border-radius: 48px 36px 52px 40px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    box-shadow:
      0 30px 60px -20px rgba(90, 74, 76, 0.15),
      0 10px 30px -15px rgba(236, 208, 201, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 1);

    opacity: 0;
    transform: translateY(24px) scale(0.97);
    animation: cardIn 1100ms cubic-bezier(.2,.7,.2,1) 150ms forwards;
  }

  /* Dot cluster trang trí góc trên phải */
  .dots {
    position: absolute;
    top: 26px;
    right: 30px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    opacity: 0;
    animation: fadeIn 700ms ease 750ms forwards;
  }
  .dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--blush-2);
  }
  .dots span:nth-child(2),
  .dots span:nth-child(4),
  .dots span:nth-child(9) {
    background: var(--mint);
  }

  /* ---------- NỘI DUNG ---------- */
  .body {
    display: grid;
    gap: 26px;
    text-align: center;
  }

  /* Soft pill label */
  .label {
    display: inline-flex;
    justify-self: center;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    background: var(--blush);
    color: var(--ink-soft);
    font-family: 'Courier New', monospace;
    font-size: 9.5px;
    letter-spacing: 3px;
    text-transform: uppercase;
    border-radius: 999px;
    border: 1px solid rgba(236, 208, 201, 0.8);
    opacity: 0;
    animation: fadeUp 700ms cubic-bezier(.2,.7,.2,1) 500ms forwards;
  }
  .label::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--blush-2);
  }

  /* Tên — light weight, editorial */
  .name {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: clamp(30px, 7vw, 40px);
    font-weight: 400;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: var(--ink);
    opacity: 0;
    animation: nameFade 1200ms cubic-bezier(.2,.7,.2,1) 650ms forwards;
  }
  .name em {
    font-style: italic;
    color: var(--ink-soft);
  }

  /* Soft divider: 3 dots nhỏ */
  .soft-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 2px 0;
    opacity: 0;
    animation: fadeIn 700ms ease 1000ms forwards;
  }
  .soft-dots span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--blush-2);
  }
  .soft-dots span:nth-child(2) {
    background: var(--mint);
  }

  /* Meta — 2 cột dạng soft cards */
  .meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .meta-item {
    padding: 16px 14px;
    background: rgba(253, 249, 245, 0.9);
    border-radius: 20px 16px 20px 16px;
    border: 1px solid rgba(236, 208, 201, 0.5);
    display: grid;
    gap: 6px;
    opacity: 0;
    animation: riseIn 800ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .meta-item:nth-child(1) { animation-delay: 1100ms; }
  .meta-item:nth-child(2) { animation-delay: 1250ms; }

  .meta-key {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta-val {
    font-family: 'Georgia', serif;
    font-size: 20px;
    font-style: italic;
    color: var(--ink);
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes nameFade {
    from { opacity: 0; filter: blur(4px); transform: translateY(6px); }
    to   { opacity: 1; filter: blur(0);   transform: translateY(0); }
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .card, .dots, .label, .name, .soft-dots, .meta-item {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 420px) {
    .card { padding: 44px 26px 36px; border-radius: 40px 32px 44px 36px; }
    .name { font-size: 28px; }
    .meta-val { font-size: 18px; }
    .meta-item { padding: 14px 10px; }
    .dots { top: 20px; right: 22px; }
  }
</style>
</head>
<body>

  <!-- BACKGROUND BLUSH WASH -->
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <!-- CARD -->
    <article class="card">

      <!-- Dot cluster -->
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>

      <div class="body">

        <span class="label">Hồ sơ</span>

        <h1 class="name">
          Nguyễn<br>
          <em>Thanh Huy</em>
        </h1>

        <div class="soft-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>

        <div class="meta">
          <div class="meta-item">
            <span class="meta-key">Năm sinh</span>
            <span class="meta-val">2007</span>
          </div>
          <div class="meta-item">
            <span class="meta-key">Quê quán</span>
            <span class="meta-val">Quảng Nam</span>
          </div>
        </div>

      </div>
    </article>
  </main>

</body>
</html>
