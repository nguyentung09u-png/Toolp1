<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nguyễn Thanh Huy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --graphite-0: #0e0e10;
    --graphite-1: #17171a;
    --graphite-2: #222226;
    --graphite-3: #2e2e34;
    --ash:        #e8e8ea;
    --ash-soft:   #c8c8cc;
    --muted:      #78787e;
    --line:       rgba(232, 232, 234, 0.12);
    --line-soft:  rgba(232, 232, 234, 0.06);
  }

  html, body {
    min-height: 100%;
    font-family: 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
    background: var(--graphite-0);
    color: var(--ash);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- BACKGROUND: GRAIN + LIGHT BEAM ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg, #0e0e10 0%, #131316 45%, #0a0a0c 100%);
  }
  /* Light beam chéo mảnh — "spotlight" tĩnh */
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(115deg,
        transparent 30%,
        rgba(232, 232, 234, 0.035) 45%,
        rgba(232, 232, 234, 0.06) 50%,
        rgba(232, 232, 234, 0.035) 55%,
        transparent 70%);
  }
  /* Grain mạnh hơn (mono) */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.35;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }

  /* ---------- CARD: TICKET STUB (perforation + notch 2 bên) ---------- */
  .ticket {
    position: relative;
    width: min(380px, 100%);
    opacity: 0;
    transform: translateY(20px);
    animation: ticketIn 1000ms cubic-bezier(.2,.7,.2,1) 120ms forwards;
  }

  /* Card chính — dùng mask để tạo notch 2 bên (perforation) */
  .ticket-body {
    position: relative;
    background: linear-gradient(160deg, #222226 0%, #17171a 55%, #0e0e10 100%);
    /* Notch 2 bên ở vị trí 60% để tách "stub" */
    -webkit-mask:
      radial-gradient(circle 12px at 0 68%, transparent 98%, #000 100%),
      radial-gradient(circle 12px at 100% 68%, transparent 98%, #000 100%),
      linear-gradient(#000 0 0);
    -webkit-mask-composite: source-in, source-in;
            mask:
      radial-gradient(circle 12px at 0 68%, transparent 98%, #000 100%),
      radial-gradient(circle 12px at 100% 68%, transparent 98%, #000 100%),
      linear-gradient(#000 0 0);
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, 0.95),
      0 0 0 1px var(--line),
      inset 0 1px 0 rgba(232, 232, 234, 0.06);
  }

  /* Viền hairline trên */
  .ticket-body::before {
    content: "";
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ash-soft), transparent);
    opacity: 0.4;
  }

  /* Perforation dashed line ngang — tách top/bottom */
  .perf {
    position: relative;
    height: 1px;
    margin: 0 20px;
    border-top: 1px dashed rgba(232, 232, 234, 0.2);
  }

  /* ---------- TOP SECTION (main) ---------- */
  .top {
    padding: 46px 34px 30px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 600ms ease 500ms forwards;
  }
  .eyebrow-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--ash-soft), transparent);
    opacity: 0.4;
  }
  .eyebrow-text {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .name {
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-size: clamp(30px, 7vw, 42px);
    font-weight: 300;
    letter-spacing: -1px;
    line-height: 1.02;
    color: var(--ash);
    opacity: 0;
    animation: slideName 1000ms cubic-bezier(.2,.7,.2,1) 650ms forwards;
  }
  .name strong {
    font-weight: 700;
    display: block;
  }

  /* ---------- BOTTOM SECTION (stub) ---------- */
  .bottom {
    padding: 28px 34px 34px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 18px;
  }
  .stub-item {
    display: grid;
    gap: 6px;
    opacity: 0;
    animation: fadeUp 700ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .stub-item:nth-child(1) { animation-delay: 950ms; }
  .stub-item:nth-child(3) { animation-delay: 1100ms; }

  .stub-key {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .stub-val {
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: var(--ash);
  }

  /* Dashed vertical divider giữa 2 stub */
  .stub-divider {
    width: 1px;
    height: 100%;
    min-height: 32px;
    border-left: 1px dashed rgba(232, 232, 234, 0.18);
    opacity: 0;
    animation: fadeIn 600ms ease 1200ms forwards;
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes ticketIn {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideName {
    from { opacity: 0; transform: translateX(-8px); filter: blur(2px); }
    to   { opacity: 1; transform: translateX(0);    filter: blur(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .ticket, .eyebrow, .name, .stub-item, .stub-divider {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 420px) {
    .top { padding: 40px 24px 26px; }
    .bottom { padding: 24px 24px 28px; gap: 12px; }
    .name { font-size: 28px; }
    .stub-val { font-size: 16px; }
    .stub-key { letter-spacing: 2px; font-size: 8.5px; }
    .perf { margin: 0 16px; }
  }
</style>
</head>
<body>

  <!-- BACKGROUND GRAIN + BEAM -->
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <!-- TICKET CARD -->
    <article class="ticket">
      <div class="ticket-body">

        <!-- Section trên: tên -->
        <div class="top">
          <div class="eyebrow">
            <span class="eyebrow-line"></span>
            <span class="eyebrow-text">Hồ sơ</span>
          </div>
          <h1 class="name">
            Nguyễn
            <strong>Thanh Huy</strong>
          </h1>
        </div>

        <!-- Perforation dashed -->
        <div class="perf" aria-hidden="true"></div>

        <!-- Section dưới: meta stub -->
        <div class="bottom">
          <div class="stub-item">
            <span class="stub-key">Năm sinh</span>
            <span class="stub-val">2007</span>
          </div>
          <span class="stub-divider" aria-hidden="true"></span>
          <div class="stub-item">
            <span class="stub-key">Quê quán</span>
            <span class="stub-val">Quảng Nam</span>
          </div>
        </div>

      </div>
    </article>
  </main>

</body>
</html>
