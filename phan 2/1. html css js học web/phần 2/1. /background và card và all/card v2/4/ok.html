<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nguyễn Thanh Huy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sand-deep:  #2a1e14;
    --sand-2:     #3a2818;
    --sand-3:     #4a3420;
    --terracotta: #c8603a;
    --terracotta-2:#a04a2a;
    --amber:      #e8a94a;
    --cream:      #f7ecd9;
    --cream-soft: #f0dcc0;
    --muted:      #a08060;
    --hairline:   rgba(232, 169, 74, 0.25);
  }

  html, body {
    min-height: 100%;
    font-family: 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
    background: var(--sand-deep);
    color: var(--cream);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- BACKGROUND: SUNSET HORIZON BANDS ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        #2a1e14 0%,
        #3a2818 22%,
        #4a3020 38%,
        #6a3a24 48%,
        #c8603a 50%,
        #e8a94a 50.5%,
        #4a3020 52%,
        #3a2818 65%,
        #2a1e14 100%);
  }
  /* Làm mềm dải horizon bằng radial overlay */
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 30% at 50% 50%, rgba(232, 169, 74, 0.35), transparent 70%),
      radial-gradient(ellipse 50% 20% at 30% 50%, rgba(200, 96, 58, 0.25), transparent 70%);
    mix-blend-mode: screen;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.25;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.75  0 0 0 0 0.5  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }

  /* ---------- CARD: TORN-PAPER SOFT EDGE ---------- */
  .card {
    position: relative;
    width: min(400px, 100%);
    padding: 46px 38px 40px;
    background:
      linear-gradient(165deg, #3a2818 0%, #2a1e14 50%, #1e140c 100%);
    /* Border-radius không đều — gợi torn paper */
    border-radius: 6px 24px 8px 20px;
    border: 1px solid var(--hairline);
    box-shadow:
      0 40px 90px -30px rgba(0, 0, 0, 0.95),
      0 0 0 1px rgba(232, 169, 74, 0.08),
      0 0 60px -25px rgba(200, 96, 58, 0.4),
      inset 0 1px 0 rgba(247, 236, 217, 0.08);

    opacity: 0;
    transform: translateY(24px);
    animation: cardRise 1000ms cubic-bezier(.2,.7,.2,1) 120ms forwards;
  }
  /* Top accent: dải amber mảnh gợi ánh sunset trên giấy */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg,
      var(--terracotta-2) 0%,
      var(--terracotta) 30%,
      var(--amber) 60%,
      var(--terracotta) 100%);
    border-radius: 6px 24px 0 0;
    opacity: 0.9;
  }
  /* Corner texture nhẹ góc dưới trái */
  .card::after {
    content: "";
    position: absolute;
    bottom: 0; left: 0;
    width: 40%;
    height: 30%;
    background: radial-gradient(circle at bottom left, rgba(232, 169, 74, 0.08), transparent 70%);
    pointer-events: none;
  }

  /* ---------- NỘI DUNG ---------- */
  .body {
    position: relative;
    display: grid;
    gap: 24px;
  }

  /* Top label nhỏ (không phải content mới — chỉ là cấu trúc nhãn) */
  .top-label {
    font-family: 'Courier New', monospace;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--amber);
    opacity: 0;
    animation: fadeIn 600ms ease 500ms forwards;
  }

  /* Tên lớn — rounded sans */
  .name {
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-size: clamp(28px, 6.5vw, 38px);
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.05;
    color: var(--cream);
    opacity: 0;
    animation: nameReveal 1000ms cubic-bezier(.2,.7,.2,1) 650ms forwards;
  }
  .name .word {
    display: inline-block;
    opacity: 0;
    animation: wordIn 700ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .name .word:nth-child(1) { animation-delay: 650ms; }
  .name .word:nth-child(2) { animation-delay: 770ms; }
  .name .word:nth-child(3) { animation-delay: 890ms; }

  /* Brush underline — accent đặc trưng edition này */
  .brush {
    position: relative;
    height: 8px;
    margin-top: 6px;
    width: 62%;
    opacity: 0;
    animation: brushIn 900ms cubic-bezier(.2,.7,.2,1) 1050ms forwards;
  }
  .brush svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Bottom strip: meta ngang, phân tách bằng dot */
  .strip {
    display: flex;
    align-items: baseline;
    gap: 14px;
    padding-top: 8px;
    border-top: 1px solid rgba(232, 169, 74, 0.15);
    opacity: 0;
    animation: slideUp 800ms cubic-bezier(.2,.7,.2,1) 1250ms forwards;
  }
  .strip-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .strip-key {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .strip-val {
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: var(--cream-soft);
  }
  .strip-divider {
    width: 1px;
    height: 26px;
    background: linear-gradient(180deg, transparent, var(--amber), transparent);
    opacity: 0.5;
    align-self: center;
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes cardRise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes nameReveal {
    to { opacity: 1; }
  }
  @keyframes wordIn {
    from { opacity: 0; transform: translateY(6px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  @keyframes brushIn {
    from { opacity: 0; transform: scaleX(0); transform-origin: left; }
    to   { opacity: 1; transform: scaleX(1); transform-origin: left; }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .card, .top-label, .name, .name .word, .brush, .strip {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 420px) {
    .card { padding: 40px 26px 34px; }
    .name { font-size: 27px; }
    .strip-val { font-size: 15px; }
    .strip-key { letter-spacing: 2px; font-size: 8.5px; }
  }
</style>
</head>
<body>

  <!-- BACKGROUND SUNSET BANDS -->
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <!-- CARD -->
    <article class="card">
      <div class="body">

        <!-- Top label -->
        <div class="top-label">Hồ sơ</div>

        <!-- Tên -->
        <h1 class="name">
          <span class="word">Nguyễn</span>
          <span class="word">Thanh</span>
          <span class="word">Huy</span>
        </h1>

        <!-- Brush underline -->
        <div class="brush" aria-hidden="true">
          <svg viewBox="0 0 200 8" preserveAspectRatio="none">
            <path d="M2 5 Q 30 1, 60 4 T 120 3 T 195 4"
                  fill="none"
                  stroke="url(#brushGrad)"
                  stroke-width="2.5"
                  stroke-linecap="round"/>
            <defs>
              <linearGradient id="brushGrad" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#a04a2a" stop-opacity="0.9"/>
                <stop offset="50%" stop-color="#e8a94a" stop-opacity="1"/>
                <stop offset="100%" stop-color="#c8603a" stop-opacity="0.3"/>
              </linearGradient>
            </defs>
          </svg>
        </div>

        <!-- Bottom strip -->
        <div class="strip">
          <div class="strip-item">
            <span class="strip-key">Năm sinh</span>
            <span class="strip-val">2007</span>
          </div>
          <span class="strip-divider" aria-hidden="true"></span>
          <div class="strip-item">
            <span class="strip-key">Quê quán</span>
            <span class="strip-val">Quảng Nam</span>
          </div>
        </div>

      </div>
    </article>
  </main>

</body>
</html>
