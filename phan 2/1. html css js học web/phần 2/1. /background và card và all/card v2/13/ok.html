<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nguyễn Thanh Huy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --paper:   #f0e9d8;
    --paper-2: #e4dac4;
    --ink:     #0d0d0d;
    --ink-2:   #1a1a1a;
    --pop-a:   #ff4d2e;
    --pop-b:   #ffd93d;
    --pop-c:   #2e6fff;
    --pop-d:   #00c96b;
    --white:   #ffffff;
  }

  html, body {
    min-height: 100%;
    font-family: 'Helvetica Neue', 'Arial Black', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- BACKGROUND: DOT GRID PAPER ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 92% 8%, rgba(255, 77, 46, 0.12), transparent 30%),
      radial-gradient(circle at 5% 95%, rgba(46, 111, 255, 0.10), transparent 32%),
      var(--paper);
  }
  /* Dot grid pattern */
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(13, 13, 13, 0.18) 1px, transparent 1.4px);
    background-size: 22px 22px;
    background-position: 0 0;
  }
  /* Diagonal ribbon decorative góc dưới phải */
  .bg::after {
    content: "";
    position: absolute;
    top: 0;
    right: -60px;
    width: 240px;
    height: 100vh;
    background: repeating-linear-gradient(
      45deg,
      var(--pop-b) 0 14px,
      var(--ink) 14px 28px
    );
    transform: skewX(-8deg);
    opacity: 0.10;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }

  /* ---------- CARD WRAPPER ---------- */
  .card-wrap {
    position: relative;
    width: min(340px, 88vw);
    aspect-ratio: 9 / 16;
    opacity: 0;
    animation: wrapIn 900ms cubic-bezier(.2,.8,.2,1) 100ms forwards;
  }
  @keyframes wrapIn {
    from { opacity: 0; transform: translate(-10px, 20px) rotate(-3deg); }
    to   { opacity: 1; transform: translate(0, 0) rotate(-1.2deg); }
  }

  /* Hard shadow block — brutalist signature */
  .card-shadow {
    position: absolute;
    inset: 0;
    background: var(--ink);
    border: 3px solid var(--ink);
    border-radius: 4px;
    transform: translate(10px, 10px);
    z-index: 0;
  }

  /* ---------- CARD ---------- */
  .card {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--white);
    border: 3px solid var(--ink);
    border-radius: 4px;
    overflow: hidden;
  }

  /* ===== TOP BAR (block color) ===== */
  .top-bar {
    display: flex;
    align-items: stretch;
    border-bottom: 3px solid var(--ink);
    flex-shrink: 0;
  }

  .top-block {
    flex: 1;
    padding: 12px 14px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .top-block:first-child {
    background: var(--pop-a);
    border-right: 3px solid var(--ink);
    color: var(--white);
  }
  .top-block:last-child {
    background: var(--pop-b);
    flex: 0 0 auto;
    padding-left: 18px;
    padding-right: 18px;
  }

  .top-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--white);
    box-shadow: 0 0 0 2px var(--pop-a);
  }
  .top-block:last-child .top-dot {
    background: var(--ink);
    box-shadow: none;
  }

  /* ===== NAME STAGE (trung tâm, lớn) ===== */
  .name-stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px 22px 20px;
    position: relative;
    background:
      linear-gradient(0deg, rgba(13,13,13,0.02), rgba(13,13,13,0.02)),
      var(--white);
  }

  /* Label dọc — sticker text */
  .sticker {
    position: absolute;
    top: 18px;
    right: 16px;
    background: var(--ink);
    color: var(--pop-b);
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 10px;
    transform: rotate(6deg);
    border: 2px solid var(--ink);
    box-shadow: 3px 3px 0 var(--pop-a);
    opacity: 0;
    animation: stickerIn 600ms cubic-bezier(.2,.8,.2,1) 700ms forwards;
  }
  @keyframes stickerIn {
    from { opacity: 0; transform: rotate(15deg) scale(0.7); }
    to   { opacity: 1; transform: rotate(6deg) scale(1); }
  }

  .eyebrow-line {
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink);
    margin-bottom: 12px;
    padding-left: 8px;
    border-left: 4px solid var(--pop-a);
    opacity: 0;
    animation: riseIn 600ms cubic-bezier(.2,.8,.2,1) 450ms forwards;
  }

  .name {
    font-family: 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
    font-size: clamp(40px, 11vw, 54px);
    font-weight: 900;
    line-height: 0.82;
    letter-spacing: -3.5px;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0;
    animation: riseIn 700ms cubic-bezier(.2,.8,.2,1) 550ms forwards;
  }
  .name-line {
    display: block;
  }
  .name-line.accent {
    color: var(--pop-a);
    -webkit-text-stroke: 2px var(--ink);
    paint-order: stroke fill;
    text-shadow: 5px 5px 0 var(--ink);
  }

  /* Bar ngang dưới tên */
  .name-bar {
    height: 6px;
    background: var(--ink);
    margin-top: 16px;
    display: flex;
    opacity: 0;
    animation: barGrow 700ms cubic-bezier(.2,.8,.2,1) 900ms forwards;
    transform-origin: left;
  }
  @keyframes barGrow {
    from { opacity: 0; transform: scaleX(0); }
    to   { opacity: 1; transform: scaleX(1); }
  }
  .name-bar span:nth-child(1) { flex: 3; background: var(--ink); }
  .name-bar span:nth-child(2) { flex: 1; background: var(--pop-b); }
  .name-bar span:nth-child(3) { flex: 1; background: var(--pop-a); }

  /* ===== META BLOCKS ===== */
  .meta-blocks {
    flex-shrink: 0;
    border-top: 3px solid var(--ink);
  }
  .meta-block {
    display: flex;
    align-items: stretch;
    border-bottom: 3px solid var(--ink);
    min-height: 58px;
  }
  .meta-block:last-child { border-bottom: none; }

  .meta-key {
    flex: 0 0 45%;
    padding: 14px 12px;
    background: var(--paper);
    border-right: 3px solid var(--ink);
    font-family: 'Courier New', monospace;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink);
    display: flex;
    align-items: center;
    opacity: 0;
    animation: fadeUp 600ms ease forwards;
  }
  .meta-block:nth-child(1) .meta-key { animation-delay: 1050ms; }
  .meta-block:nth-child(2) .meta-key { animation-delay: 1180ms; }

  .meta-val {
    flex: 1;
    padding: 14px 16px;
    background: var(--white);
    font-family: 'Arial Black', 'Helvetica Neue', system-ui, sans-serif;
    font-size: 18px;
    font-weight: 900;
    color: var(--ink);
    display: flex;
    align-items: center;
    letter-spacing: -0.5px;
    opacity: 0;
    animation: fadeUp 600ms ease forwards;
  }
  .meta-block:nth-child(1) .meta-val {
    animation-delay: 1050ms;
    background: var(--pop-c);
    color: var(--white);
  }
  .meta-block:nth-child(2) .meta-val {
    animation-delay: 1180ms;
    background: var(--pop-d);
    color: var(--white);
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Corner chip (nhô ra ngoài) ===== */
  .chip {
    position: absolute;
    top: -14px;
    left: 20px;
    background: var(--ink);
    color: var(--white);
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.5px;
    padding: 6px 12px;
    border: 3px solid var(--ink);
    z-index: 3;
    transform: rotate(-3deg);
    opacity: 0;
    animation: chipIn 500ms cubic-bezier(.2,.8,.2,1) 350ms forwards;
  }
  @keyframes chipIn {
    from { opacity: 0; transform: rotate(-3deg) translateY(-10px); }
    to   { opacity: 1; transform: rotate(-3deg) translateY(0); }
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .card-wrap, .sticker, .eyebrow-line, .name, .name-bar,
    .meta-key, .meta-val, .chip {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .card-wrap { transform: rotate(-1.2deg) !important; }
    .sticker  { transform: rotate(6deg) !important; }
    .chip     { transform: rotate(-3deg) !important; }
    .name-bar { transform: none !important; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 420px) {
    .card-wrap { width: min(300px, 86vw); }
    .card-shadow { transform: translate(8px, 8px); }
    .name { letter-spacing: -2.5px; }
    .meta-val { font-size: 16px; }
    .top-block { font-size: 9px; padding: 10px 12px; letter-spacing: 1.5px; }
    .name-stage { padding: 20px 18px 16px; }
  }

  /* ---------- TABLET+ ---------- */
  @media (min-width: 700px) {
    .card-wrap { width: min(380px, 90vw); }
  }
</style>
</head>
<body>

  <!-- BACKGROUND DOT GRID PAPER -->
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">

    <!-- CARD WRAP -->
    <div class="card-wrap">

      <!-- Hard shadow -->
      <div class="card-shadow" aria-hidden="true"></div>

      <!-- Chip nhô ra -->
      <div class="chip" aria-hidden="true">HỒ SƠ</div>

      <!-- CARD -->
      <article class="card">

        <!-- TOP BAR -->
        <div class="top-bar">
          <div class="top-block">
            <span class="top-dot"></span>
            <span>PROFILE</span>
          </div>
          <div class="top-block">
            <span>'07</span>
            <span class="top-dot"></span>
          </div>
        </div>

        <!-- NAME STAGE -->
        <div class="name-stage">

          <div class="sticker" aria-hidden="true">NEW</div>

          <div class="eyebrow-line">Nguyễn Thanh</div>

          <h1 class="name">
            <span class="name-line">Huy</span>
            <span class="name-line accent">2007</span>
          </h1>

          <div class="name-bar" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>

        </div>

        <!-- META BLOCKS -->
        <div class="meta-blocks">
          <div class="meta-block">
            <div class="meta-key">Năm sinh</div>
            <div class="meta-val">2007</div>
          </div>
          <div class="meta-block">
            <div class="meta-key">Quê quán</div>
            <div class="meta-val">Quảng Nam</div>
          </div>
        </div>

      </article>

    </div>
  </main>

</body>
</html>
