<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nguyễn Thanh Huy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --board-0:  #101014;
    --board-1:  #17171d;
    --board-2:  #1f1f28;
    --board-3:  #282832;
    --paper:    #f7f2e8;
    --paper-2:  #ede4d0;
    --ink:      #141418;
    --pink:     #ff6ba8;
    --lime:     #c4ff3d;
    --sky:      #5ec8ff;
    --orange:   #ff9b47;
    --violet:   #a57bff;
    --muted:    #6a6a7a;
    --line:     rgba(247, 242, 232, 0.10);
  }

  html, body {
    min-height: 100%;
    font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
    background: var(--board-0);
    color: var(--paper);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- BACKGROUND: STICKER BOARD ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 55% 45% at 25% 22%, rgba(255, 107, 168, 0.10), transparent 60%),
      radial-gradient(ellipse 50% 40% at 78% 80%, rgba(196, 255, 61, 0.08), transparent 60%),
      radial-gradient(ellipse 45% 35% at 50% 100%, rgba(94, 200, 255, 0.06), transparent 60%),
      linear-gradient(180deg, #101014 0%, #17171d 55%, #101014 100%);
  }
  /* Lưới mờ kiểu corkboard */
  .bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(247, 242, 232, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(247, 242, 232, 0.025) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  /* Grain */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.24;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.94  0 0 0 0 0.9  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
  }

  /* ---------- CARD WRAPPER ---------- */
  .card-wrap {
    position: relative;
    width: min(360px, 90vw);
    aspect-ratio: 3 / 4;
    opacity: 0;
    animation: wrapIn 1000ms cubic-bezier(.16,1,.3,1) 100ms forwards;
  }
  @keyframes wrapIn { to { opacity: 1; } }

  /* ---------- CARD — 4 GÓC BO TRÒN ---------- */
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 28px;            /* ← giữ 4 góc bo */
    background:
      linear-gradient(155deg,
        var(--board-3) 0%,
        var(--board-2) 40%,
        var(--board-1) 75%,
        var(--board-0) 100%);
    border: 1px solid var(--line);
    box-shadow:
      0 50px 100px -40px rgba(0, 0, 0, 0.9),
      0 0 0 1px rgba(247, 242, 232, 0.04),
      0 0 80px -30px rgba(255, 107, 168, 0.20),
      inset 0 1px 0 rgba(247, 242, 232, 0.08);
    overflow: hidden;
  }
  /* Top edge highlight */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 24px; right: 24px;
    height: 1px;
    background: linear-gradient(90deg,
      transparent, rgba(255, 107, 168, 0.4), transparent);
    pointer-events: none;
    z-index: 5;
  }

  /* ---------- BASE CONTENT (mờ, chìm dưới sticker) ---------- */
  .base-content {
    position: absolute;
    inset: 0;
    padding: 44px 32px 34px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 1;
  }

  .base-top {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .base-mid {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .base-eyebrow {
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .base-name {
    font-size: clamp(30px, 8vw, 42px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 0.92;
    color: rgba(247, 242, 232, 0.18);
    -webkit-text-stroke: 1px rgba(247, 242, 232, 0.15);
  }

  .base-bottom {
    display: flex;
    justify-content: space-between;
    font-family: 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(247, 242, 232, 0.18);
  }

  /* ---------- STICKERS ---------- */
  .stickers {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }

  .sticker {
    position: absolute;
    display: inline-flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    box-shadow:
      0 10px 24px -8px rgba(0, 0, 0, 0.5),
      0 4px 10px -2px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
    font-family: 'Inter', system-ui, sans-serif;
    /* Sticker look */
    border: 1px solid rgba(20, 20, 24, 0.08);
    opacity: 0;
    animation: stickerIn 700ms cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes stickerIn {
    from { opacity: 0; transform: var(--rot) scale(0.6); }
    to   { opacity: 1; transform: var(--rot) scale(1); }
  }

  /* Tape nhỏ góc — như dán bằng washi tape */
  .sticker::before {
    content: "";
    position: absolute;
    top: -8px;
    left: 50%;
    width: 36px;
    height: 14px;
    background: rgba(255, 107, 168, 0.55);
    transform: translateX(-50%) rotate(-2deg);
    border-radius: 2px;
    opacity: 0.9;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
  }

  /* Sticker variants */
  .sticker.s-name {
    top: 22%;
    left: 8%;
    padding: 18px 22px 16px;
    background: var(--paper);
    --rot: rotate(-3deg);
    animation-delay: 400ms;
    box-shadow:
      0 16px 32px -10px rgba(0, 0, 0, 0.55),
      0 6px 14px -3px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }
  .s-name .sk-label {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .s-name .sk-val {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .s-name .sk-val em {
    display: block;
    font-style: italic;
    color: #b8312e;
  }

  .sticker.s-year {
    top: 10%;
    right: 10%;
    padding: 12px 16px;
    background: var(--lime);
    --rot: rotate(5deg);
    animation-delay: 550ms;
    color: var(--ink);
  }
  .s-year .sk-num {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: -1px;
    line-height: 1;
  }
  .s-year .sk-label {
    font-family: 'Courier New', monospace;
    font-size: 7.5px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(20, 20, 24, 0.6);
  }

  .sticker.s-place {
    bottom: 22%;
    right: 8%;
    padding: 12px 16px;
    background: var(--sky);
    --rot: rotate(-4deg);
    animation-delay: 700ms;
    color: var(--ink);
  }
  .s-place .sk-label {
    font-family: 'Courier New', monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(20, 20, 24, 0.55);
  }
  .s-place .sk-val {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.3px;
    line-height: 1;
  }

  .sticker.s-tag {
    bottom: 10%;
    left: 10%;
    padding: 8px 14px;
    background: var(--orange);
    --rot: rotate(6deg);
    animation-delay: 850ms;
    color: var(--ink);
    border-radius: 999px;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }
  .s-tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink);
  }
  .s-tag .sk-text {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* Sticker nhỏ decorative (hình tròn) */
  .sticker.s-star {
    top: 45%;
    left: 42%;
    width: 42px;
    height: 42px;
    padding: 0;
    background: var(--violet);
    border-radius: 50%;
    --rot: rotate(-8deg);
    animation-delay: 950ms;
    display: grid;
    place-items: center;
    color: var(--paper);
    font-size: 18px;
    font-weight: 900;
    font-family: 'Inter', system-ui, sans-serif;
  }
  .s-star::before { display: none; } /* bỏ tape cho sticker tròn */

  /* Tape cho từng sticker — chỉ hiện với sticker vuông */
  .s-year::before { background: var(--pink); }
  .s-place::before { background: var(--lime); }
  .s-tag::before { display: none; }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .card-wrap, .sticker {
      animation: none !important;
      opacity: 1 !important;
    }
    .sticker.s-name  { transform: rotate(-3deg) !important; }
    .sticker.s-year  { transform: rotate(5deg) !important; }
    .sticker.s-place { transform: rotate(-4deg) !important; }
    .sticker.s-tag   { transform: rotate(6deg) !important; }
    .sticker.s-star  { transform: rotate(-8deg) !important; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 420px) {
    .card-wrap { width: min(310px, 88vw); }
    .card { border-radius: 24px; }
    .base-content { padding: 34px 24px 26px; }
    .sticker.s-name { padding: 14px 16px 12px; }
    .s-name .sk-val { font-size: 19px; }
    .s-year .sk-num { font-size: 18px; }
    .s-place .sk-val { font-size: 14px; }
    .sticker.s-star { width: 36px; height: 36px; font-size: 16px; }
  }

  /* ---------- TABLET+ ---------- */
  @media (min-width: 700px) {
    .card-wrap { width: min(400px, 90vw); }
  }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <div class="card-wrap">

      <article class="card">

        <!-- Base content (mờ, background) -->
        <div class="base-content" aria-hidden="true">
          <span class="base-top">Profile · 2026</span>
          <div class="base-mid">
            <span class="base-eyebrow">Nguyễn Thanh</span>
            <span class="base-name">Huy</span>
          </div>
          <div class="base-bottom">
            <span>Năm sinh</span>
            <span>Quê quán</span>
          </div>
        </div>

        <!-- Stickers -->
        <div class="stickers">

          <!-- Sticker tên -->
          <div class="sticker s-name">
            <span class="sk-label">Nguyễn Thanh</span>
            <span class="sk-val"><em>Huy</em></span>
          </div>

          <!-- Sticker năm sinh -->
          <div class="sticker s-year">
            <span class="sk-num">2007</span>
            <span class="sk-label">Năm sinh</span>
          </div>

          <!-- Sticker quê quán -->
          <div class="sticker s-place">
            <span class="sk-label">Quê quán</span>
            <span class="sk-val">Quảng Nam</span>
          </div>

          <!-- Sticker tag -->
          <div class="sticker s-tag">
            <span class="dot"></span>
            <span class="sk-text">Profile</span>
          </div>

          <!-- Sticker sao -->
          <div class="sticker s-star">★</div>

        </div>

      </article>

    </div>
  </main>

</body>
</html>
