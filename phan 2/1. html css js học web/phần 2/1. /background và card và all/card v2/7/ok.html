<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nguyễn Thanh Huy</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --midnight:   #0d1424;
    --midnight-2: #10192d;
    --midnight-3: #182338;
    --teal:       #5fd4c4;
    --teal-soft:  #a8e8de;
    --sand:       #e8d5b0;
    --ivory:      #f0f4f2;
    --muted:      #5a6878;
    --line:       rgba(95, 212, 196, 0.22);
  }

  html, body {
    min-height: 100%;
    font-family: 'Helvetica Neue', 'Segoe UI', system-ui, sans-serif;
    background: var(--midnight);
    color: var(--ivory);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- BACKGROUND: VERTICAL GRADIENT MESH ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      linear-gradient(180deg,
        #0a1020 0%,
        #0d1424 30%,
        #10192d 55%,
        #0d1a22 80%,
        #0a1218 100%),
      radial-gradient(ellipse 50% 40% at 50% 0%, rgba(95, 212, 196, 0.10), transparent 70%),
      radial-gradient(ellipse 60% 30% at 50% 100%, rgba(232, 213, 176, 0.06), transparent 70%);
    background-blend-mode: normal, screen, screen;
  }
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.28;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.85  0 0 0 0 0.8  0 0 0 0.04 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode: overlay;
  }

  /* ---------- STAGE ---------- */
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }

  /* ---------- CARD DỌC 9:16 ---------- */
  .card {
    position: relative;
    width: min(340px, 88vw);
    /* Tỉ lệ 9:16 dọc — aspect-ratio giúp co giãn đúng */
    aspect-ratio: 9 / 16;
    padding: 0;
    display: flex;
    flex-direction: column;
    background:
      linear-gradient(180deg,
        #182338 0%,
        #10192d 35%,
        #0d1424 65%,
        #0a1020 100%);
    border-radius: 44px;
    border: 1px solid var(--line);
    box-shadow:
      0 50px 100px -40px rgba(0, 0, 0, 0.95),
      0 0 0 1px rgba(95, 212, 196, 0.08),
      0 0 80px -30px rgba(95, 212, 196, 0.35),
      inset 0 1px 0 rgba(168, 232, 222, 0.12);
    overflow: hidden;

    opacity: 0;
    transform: translateY(24px) scale(0.96);
    animation: cardIn 1200ms cubic-bezier(.2,.7,.2,1) 120ms forwards;
  }
  /* Top highlight */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
    opacity: 0.7;
  }
  /* Ambient corner glow top */
  .card::after {
    content: "";
    position: absolute;
    top: -30%;
    left: -20%;
    width: 90%;
    height: 60%;
    background: radial-gradient(circle, rgba(95, 212, 196, 0.15), transparent 65%);
    pointer-events: none;
  }

  /* ---------- 3 TẦNG DỌC ---------- */
  .layer {
    position: relative;
    z-index: 1;
    padding: 0 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* TẦNG 1: top mark */
  .layer-top {
    flex: 0 0 22%;
    align-items: flex-start;
    padding-top: 36px;
    padding-bottom: 8px;
    opacity: 0;
    animation: fadeDown 700ms ease 400ms forwards;
  }
  .mark {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mark-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--teal);
    box-shadow: 0 0 12px rgba(95, 212, 196, 0.9);
  }
  .mark-text {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--teal-soft);
  }

  /* Horizontal tick ruler chia tầng */
  .tick {
    position: relative;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, var(--line), transparent);
    margin: 0 auto;
  }
  .tick::before,
  .tick::after {
    content: "";
    position: absolute;
    top: -2px;
    width: 1px;
    height: 5px;
    background: var(--teal);
    opacity: 0.6;
  }
  .tick::before { left: 0; }
  .tick::after  { left: 20%; }

  /* TẦNG 2: name stack (chiếm giữa) */
  .layer-mid {
    flex: 1 1 auto;
    align-items: flex-start;
    padding-top: 20px;
    padding-bottom: 20px;
  }
  .name-stack {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .name-line {
    font-family: 'Helvetica Neue', 'Arial Narrow', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 0.95;
    color: var(--ivory);
    opacity: 0;
    animation: slideDown 800ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .name-line:nth-child(1) { font-size: clamp(26px, 7vw, 34px); animation-delay: 650ms; }
  .name-line:nth-child(2) { font-size: clamp(30px, 8vw, 40px); animation-delay: 780ms; color: var(--teal-soft); }
  .name-line:nth-child(3) { font-size: clamp(26px, 7vw, 34px); animation-delay: 910ms; }

  /* TẦNG 3: meta dọc */
  .layer-bottom {
    flex: 0 0 auto;
    padding-bottom: 40px;
    gap: 14px;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid rgba(95, 212, 196, 0.10);
    opacity: 0;
    animation: fadeUp 700ms cubic-bezier(.2,.7,.2,1) forwards;
  }
  .meta-row:nth-child(1) { animation-delay: 1100ms; }
  .meta-row:nth-child(2) { animation-delay: 1250ms; border-bottom: none; }

  .meta-key {
    font-family: 'Courier New', monospace;
    font-size: 8.5px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta-val {
    font-family: 'Helvetica Neue', system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.3px;
    color: var(--sand);
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-12px); filter: blur(3px); }
    to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- REDUCED MOTION ---------- */
  @media (prefers-reduced-motion: reduce) {
    .card, .layer-top, .name-line, .meta-row {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 420px) {
    .card { width: min(300px, 82vw); border-radius: 38px; }
    .layer { padding: 0 26px; }
    .layer-top { padding-top: 30px; }
    .layer-bottom { padding-bottom: 32px; }
    .meta-val { font-size: 14px; }
    .mark-text { letter-spacing: 3px; font-size: 8.5px; }
  }

  /* ---------- TABLET+ : card to hơn ---------- */
  @media (min-width: 700px) {
    .card { width: min(380px, 90vw); }
  }
</style>
</head>
<body>

  <!-- BACKGROUND VERTICAL MESH -->
  <div class="bg" aria-hidden="true"></div>

  <main class="stage">
    <!-- CARD DỌC 9:16 -->
    <article class="card">

      <!-- TẦNG 1: mark -->
      <div class="layer layer-top">
        <div class="mark">
          <span class="mark-dot"></span>
          <span class="mark-text">Hồ sơ</span>
        </div>
      </div>

      <div class="tick" aria-hidden="true"></div>

      <!-- TẦNG 2: tên -->
      <div class="layer layer-mid">
        <h1 class="name-stack">
          <span class="name-line">Nguyễn</span>
          <span class="name-line">Thanh</span>
          <span class="name-line">Huy</span>
        </h1>
      </div>

      <!-- TẦNG 3: meta -->
      <div class="layer layer-bottom">
        <div class="meta-row">
          <span class="meta-key">Năm sinh</span>
          <span class="meta-val">2007</span>
        </div>
        <div class="meta-row">
          <span class="meta-key">Quê quán</span>
          <span class="meta-val">Quảng Nam</span>
        </div>
      </div>

    </article>
  </main>

</body>
</html>
