<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Art Deco Monolith — Sidebar v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ROOT
     ============================================================ */
  :root {
    --navy-night:  #0b0f1a;
    --navy-deep:   #1a2440;
    --navy-mid:    #141c33;
    --gold:        #c9a961;
    --gold-light:  #e8cf8f;
    --gold-deep:   #9c8248;
    --bronze:      #8b7355;
    --cream:       #e8e2d5;
    --cream-dim:   #a89f8c;

    --ease-deco:   cubic-bezier(0.4, 0, 0.2, 1);
    --ease-sweep:  cubic-bezier(0.77, 0, 0.175, 1);

    --sidebar-w:   340px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body { height: 100%; }

  body {
    font-family: 'Cormorant SC', Georgia, serif;
    background: var(--navy-night);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;

    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(201, 169, 97, 0.06), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(26, 36, 64, 0.6), transparent 65%);
  }

  /* ============================================================
     HAMBURGER — Art Deco Octagon (góc trái)
     ============================================================ */
  .hamburger {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 60;
    width: 60px;
    height: 60px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    background: var(--navy-deep);
    border: 1px solid var(--gold);
    cursor: pointer;
    /* Octagon qua clip-path */
    clip-path: polygon(
      30% 0%, 70% 0%, 100% 30%, 100% 70%,
      70% 100%, 30% 100%, 0% 70%, 0% 30%
    );
    transition:
      background 0.4s var(--ease-deco),
      transform 0.4s var(--ease-deco);
    /* Viền trong mô phỏng qua drop-shadow */
    filter: drop-shadow(0 0 8px rgba(201, 169, 97, 0.25));
  }

  .hamburger::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(201, 169, 97, 0.35);
    clip-path: polygon(
      30% 0%, 70% 0%, 100% 30%, 100% 70%,
      70% 100%, 30% 100%, 0% 70%, 0% 30%
    );
    pointer-events: none;
    transition: border-color 0.4s var(--ease-deco);
  }

  .hamburger:hover {
    background: var(--gold);
    filter: drop-shadow(0 0 14px rgba(201, 169, 97, 0.5));
  }

  .hamburger:hover::before {
    border-color: var(--navy-deep);
  }

  .hamburger:hover .hamburger__bar {
    background: var(--navy-night);
  }

  .hamburger:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 4px;
  }

  .hamburger__bar {
    display: block;
    width: 22px;
    height: 1.5px;
    background: var(--gold);
    transition:
      transform 0.45s var(--ease-deco),
      opacity 0.25s var(--ease-deco),
      background 0.4s var(--ease-deco),
      width 0.3s var(--ease-deco);
    transform-origin: center;
  }

  /* Morph 3 gạch → X */
  .hamburger[aria-expanded="true"] {
    background: var(--gold);
  }

  .hamburger[aria-expanded="true"]::before {
    border-color: var(--navy-deep);
  }

  .hamburger[aria-expanded="true"] .hamburger__bar {
    background: var(--navy-night);
  }

  .hamburger[aria-expanded="true"] .hamburger__bar:nth-child(1) {
    transform: translateY(7.5px) rotate(45deg);
  }
  .hamburger[aria-expanded="true"] .hamburger__bar:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }
  .hamburger[aria-expanded="true"] .hamburger__bar:nth-child(3) {
    transform: translateY(-7.5px) rotate(-45deg);
  }

  /* ============================================================
     BACKDROP
     ============================================================ */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: rgba(5, 8, 15, 0.72);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.5s var(--ease-deco), visibility 0s linear 0.5s;
  }

  .backdrop.is-open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.5s var(--ease-deco), visibility 0s linear 0s;
  }

  /* ============================================================
     SIDEBAR — Art Deco Monolith
     ============================================================ */
  .sidebar {
    position: fixed;
    top: 20px;
    left: 20px;
    bottom: 20px;
    z-index: 80;
    width: var(--sidebar-w);
    max-width: calc(100vw - 40px);

    background:
      linear-gradient(180deg, var(--navy-mid) 0%, var(--navy-deep) 30%, var(--navy-night) 100%);

    /* Viền ngoài đồng */
    border: 1px solid var(--gold);

    /* Clip-path chamfer 45° các góc — đặc trưng Art Deco */
    clip-path: polygon(
      0 40px,          /* góc trên trái — chamfer */
      40px 0,
      calc(100% - 40px) 0,
      100% 40px,       /* góc trên phải — chamfer */
      100% calc(100% - 40px),
      calc(100% - 40px) 100%,
      40px 100%,
      0 calc(100% - 40px)
    );

    display: flex;
    flex-direction: column;
    overflow: hidden;

    /* Drop-shadow vàng nhẹ thay vì box-shadow (do clip-path) */
    filter:
      drop-shadow(0 20px 50px rgba(0, 0, 0, 0.6))
      drop-shadow(0 0 30px rgba(201, 169, 97, 0.15));

    /* Mở bằng clip-path — không dùng translateX */
    clip-path: polygon(
      50% 50%, 50% 50%, 50% 50%, 50% 50%,
      50% 50%, 50% 50%, 50% 50%, 50% 50%
    );
    opacity: 0;
    pointer-events: none;
    transition:
      clip-path 0.7s var(--ease-sweep),
      opacity 0.3s var(--ease-deco);
  }

  .sidebar.is-open {
    clip-path: polygon(
      0 40px,
      40px 0,
      calc(100% - 40px) 0,
      100% 40px,
      100% calc(100% - 40px),
      calc(100% - 40px) 100%,
      40px 100%,
      0 calc(100% - 40px)
    );
    opacity: 1;
    pointer-events: auto;
  }

  /* Viền trong kép (double-line) — pseudo element */
  .sidebar::before {
    content: "";
    position: absolute;
    inset: 4px;
    border: 1px solid rgba(201, 169, 97, 0.4);
    clip-path: polygon(
      0 36px,
      36px 0,
      calc(100% - 36px) 0,
      100% 36px,
      100% calc(100% - 36px),
      calc(100% - 36px) 100%,
      36px 100%,
      0 calc(100% - 36px)
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Sunburst header background */
  .sidebar::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 180px;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(201, 169, 97, 0.18), transparent 60%),
      repeating-conic-gradient(
        from 0deg at 50% 100%,
        rgba(201, 169, 97, 0.06) 0deg 2deg,
        transparent 2deg 8deg
      );
    pointer-events: none;
    opacity: 0.9;
    z-index: 0;
    mask-image: linear-gradient(180deg, black 0%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, black 0%, transparent 100%);
  }

  /* ============================================================
     HEADER — Pediment + Title
     ============================================================ */
  .sidebar__header {
    position: relative;
    z-index: 3;
    padding: 44px 30px 22px;
    text-align: center;
    border-bottom: 1px solid rgba(201, 169, 97, 0.25);
  }

  .sidebar__pediment {
    display: inline-block;
    position: relative;
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.35em;
    color: var(--gold);
    text-transform: uppercase;
    padding: 0 12px;
    text-shadow:
      0 0 12px rgba(201, 169, 97, 0.4),
      0 1px 0 var(--navy-night);
  }

  /* Đường trang trí hai bên title */
  .sidebar__pediment::before,
  .sidebar__pediment::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 20px;
    height: 1px;
    background: var(--gold);
    transform: translateY(-50%);
  }

  .sidebar__pediment::before { left: -18px; }
  .sidebar__pediment::after  { right: -18px; }

  .sidebar__subtitle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
    font-family: 'Cormorant SC', serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--cream-dim);
    text-transform: uppercase;
  }

  /* Kim cương nhỏ ◆ hai bên */
  .sidebar__subtitle::before,
  .sidebar__subtitle::after {
    content: "◆";
    font-size: 6px;
    color: var(--gold);
    opacity: 0.7;
  }

  /* ============================================================
     CLOSE BUTTON — Diamond corner
     ============================================================ */
  .close-btn {
    position: absolute;
    top: 46px;
    right: 24px;
    z-index: 6;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    cursor: pointer;
    clip-path: polygon(
      50% 0%, 100% 50%, 50% 100%, 0% 50%
    );
    opacity: 0;
    transform: scale(0.6) rotate(-90deg);
    pointer-events: none;
    transition:
      opacity 0.3s var(--ease-deco),
      transform 0.5s var(--ease-deco),
      background 0.35s var(--ease-deco),
      color 0.35s var(--ease-deco);
  }

  .sidebar.is-open .close-btn {
    opacity: 1;
    transform: scale(1) rotate(0);
    pointer-events: auto;
    transition-delay: 0.4s;
  }

  .close-btn:hover {
    background: var(--gold);
    color: var(--navy-night);
  }

  .close-btn:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: 4px;
  }

  .close-btn svg {
    width: 12px;
    height: 12px;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
  }

  /* ============================================================
     NAV
     ============================================================ */
  .nav {
    position: relative;
    z-index: 3;
    flex: 1;
    overflow-y: auto;
    padding: 26px 24px 12px;
  }

  .nav::-webkit-scrollbar { width: 3px; }
  .nav::-webkit-scrollbar-track { background: transparent; }
  .nav::-webkit-scrollbar-thumb {
    background: var(--gold-deep);
  }

  .nav__list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* ============================================================
     NAV ITEM — Chamfered gold frame
     ============================================================ */
  .nav__item {
    position: relative;
  }

  .nav__link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 22px;
    color: var(--cream);
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;

    /* Chamfer góc chéo */
    clip-path: polygon(
      12px 0, 100% 0, 100% calc(100% - 12px),
      calc(100% - 12px) 100%, 0 100%, 0 12px
    );
    background: transparent;
    border: none;
    overflow: hidden;
    transition:
      color 0.4s var(--ease-deco),
      background 0.5s var(--ease-deco);
  }

  /* Viền trong mô phỏng bằng ::before (cùng clip-path) */
  .nav__link::before {
    content: "";
    position: absolute;
    inset: 0;
    background: transparent;
    border: 1px solid rgba(201, 169, 97, 0.28);
    clip-path: inherit;
    pointer-events: none;
    transition: border-color 0.4s var(--ease-deco);
  }

  /* Shimmer sweep khi hover */
  .nav__link::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(201, 169, 97, 0.25) 50%,
      transparent 100%
    );
    transition: left 0.7s var(--ease-sweep);
    pointer-events: none;
  }

  .nav__link:hover {
    color: var(--gold);
    background: rgba(201, 169, 97, 0.06);
  }

  .nav__link:hover::before {
    border-color: var(--gold);
  }

  .nav__link:hover::after {
    left: 100%;
  }

  .nav__link:focus-visible {
    outline: 2px solid var(--gold-light);
    outline-offset: -2px;
  }

  /* Kim cương marker */
  .nav__diamond {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    background: var(--gold);
    transform: rotate(45deg);
    transition:
      transform 0.5s var(--ease-deco),
      box-shadow 0.5s var(--ease-deco),
      background 0.4s var(--ease-deco);
  }

  .nav__link:hover .nav__diamond {
    transform: rotate(225deg) scale(1.2);
    box-shadow: 0 0 10px var(--gold);
  }

  .nav__label {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Số La Mã bên phải */
  .nav__roman {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--gold-deep);
    opacity: 0.6;
    transition: opacity 0.4s var(--ease-deco), color 0.4s var(--ease-deco);
  }

  .nav__link:hover .nav__roman {
    color: var(--gold);
    opacity: 1;
  }

  /* ACTIVE — gold fill */
  .nav__link.is-active {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold-deep) 100%);
    color: var(--navy-night);
  }

  .nav__link.is-active::before {
    border-color: var(--gold-light);
  }

  .nav__link.is-active .nav__diamond {
    background: var(--navy-night);
    transform: rotate(225deg);
    box-shadow: 0 0 8px rgba(0, 0, 0, 0.4);
  }

  .nav__link.is-active .nav__roman {
    color: var(--navy-deep);
    opacity: 1;
  }

  /* ============================================================
     DIVIDER — Zigzag Art Deco
     ============================================================ */
  .sidebar__divider {
    position: relative;
    z-index: 3;
    height: 8px;
    margin: 12px 30px;
    background-image:
      linear-gradient(135deg, transparent 50%, var(--gold-deep) 50%),
      linear-gradient(45deg, transparent 50%, var(--gold-deep) 50%);
    background-size: 8px 8px;
    background-position: 0 0, 4px 0;
    background-repeat: repeat-x;
    opacity: 0.5;
  }

  /* ============================================================
     FOOTER — Base with double line
     ============================================================ */
  .sidebar__footer {
    position: relative;
    z-index: 3;
    padding: 18px 30px 26px;
    text-align: center;
    border-top: 1px solid rgba(201, 169, 97, 0.25);
  }

  .sidebar__footer::before {
    content: "";
    position: absolute;
    top: 4px;
    left: 30px;
    right: 30px;
    height: 1px;
    background: rgba(201, 169, 97, 0.15);
  }

  .sidebar__footer-text {
    font-family: 'Cormorant SC', serif;
    font-size: 9px;
    letter-spacing: 0.5em;
    color: var(--gold-deep);
    text-transform: uppercase;
  }

  /* ============================================================
     BODY LOCK
     ============================================================ */
  body.is-locked { overflow: hidden; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 640px) {
    :root { --sidebar-w: calc(100vw - 32px); }
    .sidebar {
      top: 16px;
      left: 16px;
      bottom: 16px;
    }
    .hamburger {
      top: 16px;
      left: 16px;
      width: 52px;
      height: 52px;
    }
    .hamburger__bar { width: 20px; }
    .nav__link { padding: 14px 18px; font-size: 12px; gap: 12px; }
    .nav__roman { font-size: 9px; }
    .sidebar__header { padding: 36px 20px 18px; }
    .sidebar__pediment { font-size: 18px; letter-spacing: 0.28em; }
    .close-btn { top: 38px; right: 18px; width: 32px; height: 32px; }
  }

  @media (min-width: 641px) and (max-width: 1024px) {
    :root { --sidebar-w: 310px; }
  }

  /* ============================================================
     REDUCED MOTION
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-delay: 0s !important;
    }
    .sidebar {
      clip-path: polygon(
        0 40px, 40px 0, calc(100% - 40px) 0, 100% 40px,
        100% calc(100% - 40px), calc(100% - 40px) 100%,
        40px 100%, 0 calc(100% - 40px)
      );
      opacity: 1;
    }
  }
</style>
</head>
<body>

  <!-- HAMBURGER — Octagon Art Deco, góc trái -->
  <button
    class="hamburger"
    id="hamburgerBtn"
    aria-label="Mở menu điều hướng"
    aria-expanded="false"
    aria-controls="sidebar"
    type="button"
  >
    <span class="hamburger__bar"></span>
    <span class="hamburger__bar"></span>
    <span class="hamburger__bar"></span>
  </button>

  <!-- BACKDROP -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <!-- SIDEBAR -->
  <aside
    class="sidebar"
    id="sidebar"
    aria-label="Điều hướng chính"
    aria-hidden="true"
  >
    <!-- Close button (diamond) -->
    <button
      class="close-btn"
      id="closeBtn"
      aria-label="Đóng menu điều hướng"
      type="button"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>

    <!-- HEADER -->
    <div class="sidebar__header">
      <div class="sidebar__pediment">Navigation</div>
      <div class="sidebar__subtitle">Est. MMXXV</div>
    </div>

    <!-- NAV -->
    <nav class="nav" role="navigation">
      <ul class="nav__list" role="list">

        <li class="nav__item">
          <a href="#" class="nav__link is-active" data-nav="home" aria-current="page">
            <span class="nav__diamond" aria-hidden="true"></span>
            <span class="nav__label">Trang chủ</span>
            <span class="nav__roman" aria-hidden="true">I</span>
          </a>
        </li>

        <li class="nav__item">
          <a href="#" class="nav__link" data-nav="explore">
            <span class="nav__diamond" aria-hidden="true"></span>
            <span class="nav__label">Khám phá</span>
            <span class="nav__roman" aria-hidden="true">II</span>
          </a>
        </li>

        <li class="nav__item">
          <a href="#" class="nav__link" data-nav="library">
            <span class="nav__diamond" aria-hidden="true"></span>
            <span class="nav__label">Thư viện</span>
            <span class="nav__roman" aria-hidden="true">III</span>
          </a>
        </li>

        <li class="nav__item">
          <a href="#" class="nav__link" data-nav="settings">
            <span class="nav__diamond" aria-hidden="true"></span>
            <span class="nav__label">Cài đặt</span>
            <span class="nav__roman" aria-hidden="true">IV</span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Divider zigzag -->
    <div class="sidebar__divider" aria-hidden="true"></div>

    <!-- FOOTER -->
    <div class="sidebar__footer">
      <div class="sidebar__footer-text">Monolith · v5</div>
    </div>
  </aside>

  <!-- JAVASCRIPT -->
  <script>
    (function () {
      'use strict';

      const hamburger = document.getElementById('hamburgerBtn');
      const sidebar   = document.getElementById('sidebar');
      const backdrop  = document.getElementById('backdrop');
      const closeBtn  = document.getElementById('closeBtn');
      const navLinks  = sidebar.querySelectorAll('.nav__link');

      const isMobile = () => window.matchMedia('(max-width: 1024px)').matches;

      function openSidebar() {
        sidebar.classList.add('is-open');
        backdrop.classList.add('is-open');
        sidebar.setAttribute('aria-hidden', 'false');
        hamburger.setAttribute('aria-expanded', 'true');
        hamburger.setAttribute('aria-label', 'Đóng menu điều hướng');
        if (isMobile()) document.body.classList.add('is-locked');
        setTimeout(() => closeBtn.focus({ preventScroll: true }), 500);
      }

      function closeSidebar(returnFocus = true) {
        sidebar.classList.remove('is-open');
        backdrop.classList.remove('is-open');
        sidebar.setAttribute('aria-hidden', 'true');
        hamburger.setAttribute('aria-expanded', 'false');
        hamburger.setAttribute('aria-label', 'Mở menu điều hướng');
        document.body.classList.remove('is-locked');
        if (returnFocus) hamburger.focus({ preventScroll: true });
      }

      function toggleSidebar() {
        sidebar.classList.contains('is-open') ? closeSidebar() : openSidebar();
      }

      hamburger.addEventListener('click', toggleSidebar);
      closeBtn.addEventListener('click', () => closeSidebar());
      backdrop.addEventListener('click', () => closeSidebar());

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('is-open')) {
          closeSidebar();
        }
      });

      /* Active state thực */
      navLinks.forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          navLinks.forEach((l) => {
            l.classList.remove('is-active');
            l.removeAttribute('aria-current');
          });
          link.classList.add('is-active');
          link.setAttribute('aria-current', 'page');
          if (isMobile()) closeSidebar(false);
        });
      });

      /* Resize — body lock */
      window.addEventListener('resize', () => {
        if (!isMobile()) {
          document.body.classList.remove('is-locked');
        } else if (sidebar.classList.contains('is-open')) {
          document.body.classList.add('is-locked');
        }
      });
    })();
  </script>

</body>
</html>
