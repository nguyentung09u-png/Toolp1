<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Terminal Kintsugi — Sidebar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     ROOT
     ============================================================ */
  :root {
    --ink:        #0d1117;
    --ink-soft:   #11161d;
    --ink-hard:   #080b0f;
    --phosphor:   #7ef29a;          /* dịu hơn neon thuần */
    --phosphor-dim: #3a7a4a;
    --kintsugi:   #e0b64a;          /* vàng nứt */
    --kintsugi-glow: rgba(224, 182, 74, 0.35);
    --text:       #c8d3ce;
    --text-muted: #5b6b62;

    --ease-crt:   cubic-bezier(0.4, 0, 0.2, 1);
    --sidebar-w:  300px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body { height: 100%; }

  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: var(--ink);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Nền tối thiểu — chỉ để thấy hamburger */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 20%, rgba(126, 242, 154, 0.04), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(224, 182, 74, 0.03), transparent 55%);
    pointer-events: none;
    z-index: 0;
  }

  /* ============================================================
     HAMBURGER — Terminal block style
     ============================================================ */
  .hamburger {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 60;
    width: 52px;
    height: 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 5px;
    background: var(--ink-soft);
    border: 1px solid var(--phosphor-dim);
    border-radius: 2px;
    cursor: pointer;
    transition:
      border-color 0.3s var(--ease-crt),
      box-shadow 0.3s var(--ease-crt),
      background 0.3s var(--ease-crt);
    box-shadow:
      inset 0 0 0 1px rgba(126, 242, 154, 0.05),
      0 0 0 1px rgba(0, 0, 0, 0.4);
  }

  .hamburger::before {
    content: "";
    position: absolute;
    inset: -4px;
    border: 1px solid transparent;
    border-radius: 2px;
    transition: border-color 0.3s var(--ease-crt);
    pointer-events: none;
  }

  .hamburger:hover {
    border-color: var(--phosphor);
    background: var(--ink);
    box-shadow:
      inset 0 0 12px rgba(126, 242, 154, 0.1),
      0 0 20px rgba(126, 242, 154, 0.15);
  }

  .hamburger:hover::before {
    border-color: rgba(126, 242, 154, 0.25);
  }

  .hamburger:focus-visible {
    outline: 1px solid var(--phosphor);
    outline-offset: 4px;
  }

  .hamburger__bar {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--phosphor);
    box-shadow: 0 0 6px rgba(126, 242, 154, 0.5);
    transition:
      transform 0.35s var(--ease-crt),
      opacity 0.2s var(--ease-crt),
      background 0.3s var(--ease-crt);
    transform-origin: center;
  }

  /* Morph → X (terminal style, sắc nét) */
  .hamburger[aria-expanded="true"] .hamburger__bar:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
    background: var(--kintsugi);
    box-shadow: 0 0 8px var(--kintsugi-glow);
  }
  .hamburger[aria-expanded="true"] .hamburger__bar:nth-child(2) {
    opacity: 0;
    transform: scaleX(0);
  }
  .hamburger[aria-expanded="true"] .hamburger__bar:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
    background: var(--kintsugi);
    box-shadow: 0 0 8px var(--kintsugi-glow);
  }

  /* ============================================================
     BACKDROP
     ============================================================ */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 70;
    background: rgba(4, 7, 10, 0.7);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.4s var(--ease-crt), visibility 0s linear 0.4s;
  }

  .backdrop.is-open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.4s var(--ease-crt), visibility 0s linear 0s;
  }

  /* ============================================================
     SIDEBAR — Terminal Kintsugi
     ============================================================ */
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 80;
    width: var(--sidebar-w);
    max-width: 88vw;

    background: linear-gradient(180deg, var(--ink-soft) 0%, var(--ink) 100%);

    border-right: 1px solid var(--phosphor-dim);
    border-radius: 0;   /* vuông vắn */

    display: flex;
    flex-direction: column;

    transform: translateX(-100%);
    transition: transform 0.45s var(--ease-crt);

    /* Scanline overlay (rất nhẹ) */
    overflow: hidden;
  }

  /* Scanline toàn bộ sidebar */
  .sidebar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(126, 242, 154, 0.03) 0px,
      rgba(126, 242, 154, 0.03) 1px,
      transparent 1px,
      transparent 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Đường nứt kintsugi — SVG chạy dọc mép phải */
  .sidebar__crack {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 6px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.85;
  }

  .sidebar__crack svg {
    width: 100%;
    height: 100%;
  }

  .sidebar.is-open {
    transform: translateX(0);
  }

  /* ============================================================
     CLOSE BUTTON — Terminal square
     ============================================================ */
  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    z-index: 3;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    background: var(--ink-hard);
    border: 1px solid var(--phosphor-dim);
    border-radius: 2px;
    color: var(--phosphor);
    cursor: pointer;
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
    transition:
      opacity 0.3s var(--ease-crt),
      transform 0.35s var(--ease-crt),
      color 0.3s var(--ease-crt),
      border-color 0.3s var(--ease-crt),
      box-shadow 0.3s var(--ease-crt);
  }

  .sidebar.is-open .close-btn {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
    transition-delay: 0.15s;
  }

  .close-btn:hover {
    color: var(--kintsugi);
    border-color: var(--kintsugi);
    box-shadow: 0 0 14px var(--kintsugi-glow), inset 0 0 8px rgba(224,182,74,0.08);
  }

  .close-btn:hover svg {
    transform: rotate(90deg);
  }

  .close-btn:focus-visible {
    outline: 1px solid var(--kintsugi);
    outline-offset: 2px;
  }

  .close-btn svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: square;
    transition: transform 0.4s var(--ease-crt);
  }

  /* ============================================================
     BRAND ROW
     ============================================================ */
  .sidebar__brand {
    position: relative;
    z-index: 3;
    padding: 28px 24px 20px;
    font-size: 10.5px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--phosphor-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px dashed rgba(126, 242, 154, 0.12);
  }

  .sidebar__brand::before {
    content: "//";
    color: var(--kintsugi);
    opacity: 0.9;
  }

  .sidebar__brand-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--phosphor);
    box-shadow: 0 0 8px var(--phosphor);
    animation: pulse 2.4s ease-in-out infinite;
    margin-left: auto;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.4; transform: scale(0.75); }
  }

  /* ============================================================
     NAV
     ============================================================ */
  .nav {
    position: relative;
    z-index: 3;
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
  }

  .nav::-webkit-scrollbar { width: 4px; }
  .nav::-webkit-scrollbar-track { background: transparent; }
  .nav::-webkit-scrollbar-thumb {
    background: var(--phosphor-dim);
    border-radius: 0;
  }

  .nav__list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ============================================================
     NAV ITEM — Terminal line
     ============================================================ */
  .nav__link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 24px 15px 22px;
    color: var(--text-muted);
    text-decoration: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    border-left: 2px solid transparent;
    transition:
      color 0.25s var(--ease-crt),
      background 0.25s var(--ease-crt),
      border-left-color 0.25s var(--ease-crt),
      padding-left 0.25s var(--ease-crt);
  }

  /* Prefix > xuất hiện khi hover/active */
  .nav__link::before {
    content: ">";
    position: absolute;
    left: 8px;
    color: var(--phosphor);
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.2s var(--ease-crt), transform 0.2s var(--ease-crt);
    font-weight: 700;
    font-size: 12px;
  }

  .nav__link:hover {
    color: var(--phosphor);
    background: rgba(126, 242, 154, 0.03);
    border-left-color: var(--phosphor-dim);
    padding-left: 26px;
  }

  .nav__link:hover::before {
    opacity: 1;
    transform: translateX(0);
  }

  .nav__link:focus-visible {
    outline: 1px solid var(--phosphor);
    outline-offset: -3px;
  }

  /* ACTIVE */
  .nav__link.is-active {
    color: var(--kintsugi);
    border-left-color: var(--kintsugi);
    background: linear-gradient(
      90deg,
      rgba(224, 182, 74, 0.08) 0%,
      transparent 80%
    );
    padding-left: 26px;
  }

  .nav__link.is-active::before {
    content: "▸";
    color: var(--kintsugi);
    opacity: 1;
    transform: translateX(0);
    font-size: 11px;
  }

  /* ICON */
  .nav__icon {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    color: currentColor;
    transition: color 0.25s var(--ease-crt), filter 0.25s var(--ease-crt);
  }

  .nav__icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    stroke-width: 1.6;
    fill: none;
    stroke-linecap: square;
    stroke-linejoin: miter;
  }

  .nav__link:hover .nav__icon {
    filter: drop-shadow(0 0 4px rgba(126, 242, 154, 0.6));
  }

  .nav__link.is-active .nav__icon {
    filter: drop-shadow(0 0 6px var(--kintsugi-glow));
  }

  /* LABEL */
  .nav__label {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Blinking cursor ảo sau label của active item */
  .nav__link.is-active .nav__label::after {
    content: "▍";
    color: var(--kintsugi);
    margin-left: 4px;
    animation: blink 1.1s steps(2, start) infinite;
  }

  @keyframes blink {
    to { visibility: hidden; }
  }

  /* ============================================================
     FOOTER / STATUS BAR
     ============================================================ */
  .sidebar__footer {
    position: relative;
    z-index: 3;
    padding: 14px 24px;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--phosphor-dim);
    border-top: 1px dashed rgba(126, 242, 154, 0.12);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .sidebar__footer span:last-child {
    color: var(--kintsugi);
    opacity: 0.8;
  }

  /* ============================================================
     BODY LOCK
     ============================================================ */
  body.is-locked { overflow: hidden; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 640px) {
    :root { --sidebar-w: 84vw; }
    .hamburger { top: 16px; left: 16px; width: 46px; height: 46px; }
    .hamburger__bar { width: 20px; }
    .sidebar__brand { padding: 24px 20px 18px; }
    .nav__link { font-size: 15px; padding: 16px 20px 16px 20px; }
    .nav__link:hover,
    .nav__link.is-active { padding-left: 24px; }
  }

  @media (min-width: 641px) and (max-width: 1024px) {
    :root { --sidebar-w: 280px; }
  }

  /* ============================================================
     REDUCED MOTION
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-delay: 0s !important;
    }
    .sidebar__brand-dot,
    .nav__link.is-active .nav__label::after {
      animation: none;
    }
  }
</style>
</head>
<body>

  <!-- ============================================================
       HAMBURGER
       ============================================================ -->
  <button
    class="hamburger"
    id="hamburgerBtn"
    aria-label="Mở menu điều hướng"
    aria-expanded="false"
    aria-controls="sidebar"
    type="button"
  >
    <span class="hamburger__bar"></span>
    <span class="hamburger__bar"></span>
    <span class="hamburger__bar"></span>
  </button>

  <!-- ============================================================
       BACKDROP
       ============================================================ -->
  <div class="backdrop" id="backdrop" aria-hidden="true"></div>

  <!-- ============================================================
       SIDEBAR
       ============================================================ -->
  <aside
    class="sidebar"
    id="sidebar"
    aria-label="Điều hướng chính"
    aria-hidden="true"
  >
    <!-- Kintsugi crack line -->
    <div class="sidebar__crack" aria-hidden="true">
      <svg viewBox="0 0 6 800" preserveAspectRatio="none">
        <defs>
          <linearGradient id="crackGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e0b64a" stop-opacity="0"/>
            <stop offset="15%" stop-color="#e0b64a" stop-opacity="0.9"/>
            <stop offset="45%" stop-color="#e0b64a" stop-opacity="0.4"/>
            <stop offset="60%" stop-color="#e0b64a" stop-opacity="1"/>
            <stop offset="85%" stop-color="#e0b64a" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#e0b64a" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path
          d="M3 0 L2 60 L4 130 L1 210 L5 290 L2 380 L4 470 L1 560 L3 650 L2 720 L3 800"
          stroke="url(#crackGrad)"
          stroke-width="1.2"
          fill="none"
          vector-effect="non-scaling-stroke"
        />
      </svg>
    </div>

    <!-- Close -->
    <button
      class="close-btn"
      id="closeBtn"
      aria-label="Đóng menu điều hướng"
      type="button"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>

    <!-- Brand -->
    <div class="sidebar__brand">
      <span>Nav</span>
      <span class="sidebar__brand-dot" aria-hidden="true"></span>
    </div>

    <!-- NAV -->
    <nav class="nav" role="navigation">
      <ul class="nav__list" role="list">

        <li class="nav__item">
          <a href="#" class="nav__link is-active" data-nav="home" aria-current="page">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M3 11 12 4l9 7" />
                <path d="M5 10v9h14v-9" />
              </svg>
            </span>
            <span class="nav__label">Trang chủ</span>
          </a>
        </li>

        <li class="nav__item">
          <a href="#" class="nav__link" data-nav="explore">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="9" />
                <path d="M15.5 8.5 13 13l-4.5 2.5L11 11z" />
              </svg>
            </span>
            <span class="nav__label">Khám phá</span>
          </a>
        </li>

        <li class="nav__item">
          <a href="#" class="nav__link" data-nav="library">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M4 5v14" />
                <path d="M9 5v14" />
                <path d="M14 6l5 13" />
              </svg>
            </span>
            <span class="nav__label">Thư viện</span>
          </a>
        </li>

        <li class="nav__item">
          <a href="#" class="nav__link" data-nav="settings">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1" />
              </svg>
            </span>
            <span class="nav__label">Cài đặt</span>
          </a>
        </li>

      </ul>
    </nav>

    <!-- Footer -->
    <div class="sidebar__footer">
      <span>status</span>
      <span>online</span>
    </div>
  </aside>

  <!-- ============================================================
       JAVASCRIPT
       ============================================================ -->
  <script>
    (function () {
      'use strict';

      const hamburger = document.getElementById('hamburgerBtn');
      const sidebar   = document.getElementById('sidebar');
      const backdrop  = document.getElementById('backdrop');
      const closeBtn  = document.getElementById('closeBtn');
      const navLinks  = sidebar.querySelectorAll('.nav__link');

      const isMobile = () => window.matchMedia('(max-width: 1024px)').matches;

      function openSidebar() {
        sidebar.classList.add('is-open');
        backdrop.classList.add('is-open');
        sidebar.setAttribute('aria-hidden', 'false');
        hamburger.setAttribute('aria-expanded', 'true');
        hamburger.setAttribute('aria-label', 'Đóng menu điều hướng');
        if (isMobile()) document.body.classList.add('is-locked');
        closeBtn.focus({ preventScroll: true });
      }

      function closeSidebar(returnFocus = true) {
        sidebar.classList.remove('is-open');
        backdrop.classList.remove('is-open');
        sidebar.setAttribute('aria-hidden', 'true');
        hamburger.setAttribute('aria-expanded', 'false');
        hamburger.setAttribute('aria-label', 'Mở menu điều hướng');
        document.body.classList.remove('is-locked');
        if (returnFocus) hamburger.focus({ preventScroll: true });
      }

      function toggleSidebar() {
        sidebar.classList.contains('is-open') ? closeSidebar() : openSidebar();
      }

      /* Events */
      hamburger.addEventListener('click', toggleSidebar);
      closeBtn.addEventListener('click', () => closeSidebar());
      backdrop.addEventListener('click', () => closeSidebar());

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sidebar.classList.contains('is-open')) {
          closeSidebar();
        }
      });

      /* Active state thực */
      navLinks.forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          navLinks.forEach((l) => {
            l.classList.remove('is-active');
            l.removeAttribute('aria-current');
          });
          link.classList.add('is-active');
          link.setAttribute('aria-current', 'page');
          if (isMobile()) closeSidebar(false);
        });
      });

      /* Resize — đảm bảo body lock đúng */
      window.addEventListener('resize', () => {
        if (!isMobile()) {
          document.body.classList.remove('is-locked');
        } else if (sidebar.classList.contains('is-open')) {
          document.body.classList.add('is-locked');
        }
      });
    })();
  </script>

</body>
</html>
