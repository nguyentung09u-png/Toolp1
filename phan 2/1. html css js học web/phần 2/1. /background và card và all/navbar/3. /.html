<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEV STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     RESET & TOKENS
     ============================================================ */
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg-0: #05080d;
    --bg-1: #0a1018;
    --bg-2: #0e1620;
    --cyan: #00e5ff;
    --cyan-deep: #00b8d4;
    --cyan-soft: rgba(0, 229, 255, 0.12);
    --cyan-line: rgba(0, 229, 255, 0.35);
    --text: #e6f7ff;
    --text-mute: #7a93a8;
    --glass: rgba(12, 20, 30, 0.55);
    --glass-strong: rgba(10, 18, 28, 0.78);

    --cut: 14px;
    --radius: 4px;

    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    --font-sans: "Inter", system-ui, -apple-system, sans-serif;
  }

  html,
  body {
    min-height: 100%;
  }

  body {
    font-family: var(--font-sans);
    background: var(--bg-0);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* ============================================================
     AMBIENT TECH BACKGROUND (2D grid + soft neon glows)
     ============================================================ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0, 229, 255, 0.055) 1px, transparent 1px) 0 0 / 44px 44px,
      linear-gradient(90deg, rgba(0, 229, 255, 0.055) 1px, transparent 1px) 0 0 / 44px 44px;
    mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 30%, #000 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 12% -10%, rgba(0, 229, 255, 0.16), transparent 60%),
      radial-gradient(700px 500px at 92% 110%, rgba(0, 184, 212, 0.12), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ============================================================
     LAYOUT
     ============================================================ */
  .page {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  /* ============================================================
     NAVBAR
     ============================================================ */
  .navbar {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 22px;

    background: var(--glass);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(0, 229, 255, 0.16);
    border-radius: var(--radius);

    /* Cut corners (top-left + bottom-right) */
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );

    box-shadow:
      0 0 0 1px rgba(0, 229, 255, 0.05),
      0 10px 30px -12px rgba(0, 229, 255, 0.25);

    opacity: 0;
    transform: translateY(-10px);
    animation: navIn 0.6s ease 0.05s forwards;
  }

  @keyframes navIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* corner brackets decoration */
  .navbar::before,
  .navbar::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    border: 1px solid var(--cyan);
    opacity: 0.6;
    pointer-events: none;
  }
  .navbar::before {
    top: calc(var(--cut) - 4px);
    left: 6px;
    border-right: 0;
    border-bottom: 0;
  }
  .navbar::after {
    bottom: calc(var(--cut) - 4px);
    right: 6px;
    border-left: 0;
    border-top: 0;
  }

  /* --- Logo --- */
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }

  .brand-logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    color: var(--cyan);
    border: 1px solid var(--cyan-line);
    border-radius: var(--radius);
    background: rgba(0, 229, 255, 0.06);
    box-shadow:
      inset 0 0 10px rgba(0, 229, 255, 0.25),
      0 0 12px rgba(0, 229, 255, 0.2);
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .brand-logo svg {
    width: 18px;
    height: 18px;
  }

  .brand-text .dot {
    color: var(--cyan);
  }

  /* --- Menu --- */
  .nav-menu {
    display: flex;
    align-items: center;
    gap: 4px;
    list-style: none;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.6px;
    color: var(--text-mute);
    text-decoration: none;
    border: 1px solid transparent;
    border-radius: var(--radius);
    transition:
      color 0.25s ease,
      border-color 0.25s ease,
      background 0.25s ease,
      box-shadow 0.25s ease,
      transform 0.25s ease;
  }

  .nav-link svg {
    width: 15px;
    height: 15px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.25s ease;
  }

  /* Hover */
  .nav-link:hover {
    color: var(--text);
    background: rgba(0, 229, 255, 0.06);
    border-color: rgba(0, 229, 255, 0.25);
    transform: translateY(-1px);
  }
  .nav-link:hover svg {
    transform: scale(1.1);
    color: var(--cyan);
  }

  /* Active */
  .nav-link.is-active {
    color: var(--cyan);
    background: var(--cyan-soft);
    border-color: var(--cyan-line);
    box-shadow:
      inset 0 0 12px rgba(0, 229, 255, 0.18),
      0 0 14px rgba(0, 229, 255, 0.28);
  }

  /* animated underline for active */
  .nav-link.is-active::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    box-shadow: 0 0 10px var(--cyan);
    animation: pulseLine 2.2s ease-in-out infinite;
  }
  @keyframes pulseLine {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* ============================================================
     CARDS GRID
     ============================================================ */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 18px;
  }

  .stat-card {
    position: relative;
    padding: 20px 20px 22px;
    background: var(--glass-strong);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(0, 229, 255, 0.16);
    border-radius: var(--radius);
    clip-path: polygon(
      var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)),
      calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)
    );
    overflow: hidden;

    opacity: 0;
    transform: translateY(14px);
    animation: cardIn 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;

    transition:
      transform 0.3s ease,
      border-color 0.3s ease,
      box-shadow 0.3s ease;
  }

  .stat-card:nth-child(1) { animation-delay: 0.15s; }
  .stat-card:nth-child(2) { animation-delay: 0.25s; }
  .stat-card:nth-child(3) { animation-delay: 0.35s; }
  .stat-card:nth-child(4) { animation-delay: 0.45s; }

  @keyframes cardIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* subtle inner tech grid */
  .stat-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px) 0 0 / 100% 22px,
      linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px) 0 0 / 22px 100%;
    mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at 100% 0%, #000 0%, transparent 70%);
    opacity: 0.6;
    pointer-events: none;
  }

  /* top neon accent line */
  .stat-card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 14px;
    width: 46px;
    height: 2px;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    opacity: 0.9;
  }

  /* Hover */
  .stat-card:hover {
    transform: translateY(-4px);
    border-color: rgba(0, 229, 255, 0.4);
    box-shadow:
      inset 0 0 20px rgba(0, 229, 255, 0.08),
      0 16px 34px -16px rgba(0, 229, 255, 0.45);
  }

  .stat-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .stat-label {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  .stat-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    color: var(--cyan);
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.28);
    border-radius: var(--radius);
    box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.22);
    clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
  }
  .stat-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .stat-value {
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: 34px;
    line-height: 1;
    letter-spacing: -0.5px;
    color: var(--text);
    position: relative;
    z-index: 1;
    text-shadow: 0 0 18px rgba(0, 229, 255, 0.35);
  }

  .stat-value .unit {
    font-size: 14px;
    font-weight: 600;
    color: var(--cyan);
    margin-left: 6px;
    letter-spacing: 0.5px;
  }

  /* Recent Activity: thay giá trị số bằng text trạng thái ngắn */
  .stat-value.is-text {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.35;
    letter-spacing: 0;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.25);
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .pulse-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: pulseDot 1.8s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.35); opacity: 0.7; }
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 980px) {
    .cards {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 720px) {
    body {
      padding: 14px;
    }

    .page {
      gap: 22px;
    }

    .navbar {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      padding: 14px 16px;
    }

    .brand {
      justify-content: center;
    }

    .nav-menu {
      justify-content: center;
      gap: 2px;
    }

    .nav-link {
      padding: 8px 10px;
      font-size: 12px;
      flex: 1 1 auto;
      justify-content: center;
    }

    .nav-link span {
      /* giữ label để không mất chữ, chỉ thu gọn */
      display: inline;
    }

    .stat-value {
      font-size: 28px;
    }

    .stat-value.is-text {
      font-size: 15px;
    }
  }

  @media (max-width: 420px) {
    .cards {
      grid-template-columns: 1fr;
    }

    .nav-link {
      flex: 1 1 45%;
    }
  }

  /* ============================================================
     ACCESSIBILITY
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  :focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <div class="page">

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar" aria-label="Main navigation">
      <a href="#" class="brand" aria-label="DEV STUDIO home">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M8 6 3 12l5 6" />
            <path d="M16 6l5 6-5 6" />
            <path d="M14 4l-4 16" />
          </svg>
        </span>
        <span class="brand-text">DEV STUDIO<span class="dot">.</span></span>
      </a>

      <ul class="nav-menu">
        <li>
          <a href="#home" class="nav-link is-active" data-nav="home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 10.5 12 3l9 7.5" />
              <path d="M5 9.5V21h14V9.5" />
            </svg>
            <span>Home</span>
          </a>
        </li>
        <li>
          <a href="#projects" class="nav-link" data-nav="projects">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="16" rx="2" />
              <path d="M3 9h18" />
              <path d="M9 9v11" />
            </svg>
            <span>Projects</span>
          </a>
        </li>
        <li>
          <a href="#tools" class="nav-link" data-nav="tools">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14.7 6.3a4 4 0 0 0-5 5L4 17l3 3 5.7-5.7a4 4 0 0 0 5-5l-2.6 2.6-2.9-2.9 2.5-2.7Z" />
            </svg>
            <span>Tools</span>
          </a>
        </li>
        <li>
          <a href="#about" class="nav-link" data-nav="about">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 10v6" />
              <circle cx="12" cy="7.5" r="0.6" fill="currentColor" stroke="none" />
            </svg>
            <span>About</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- ================= CARDS ================= -->
    <section class="cards" aria-label="Developer statistics">

      <!-- Total Projects -->
      <article class="stat-card">
        <div class="stat-head">
          <span class="stat-label">Total Projects</span>
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
            </svg>
          </span>
        </div>
        <div class="stat-value" data-count="128">0</div>
      </article>

      <!-- Completed Tasks -->
      <article class="stat-card">
        <div class="stat-head">
          <span class="stat-label">Completed Tasks</span>
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M5 12.5 10 17.5 19 6.5" />
            </svg>
          </span>
        </div>
        <div class="stat-value" data-count="1248">0</div>
      </article>

      <!-- Active Projects -->
      <article class="stat-card">
        <div class="stat-head">
          <span class="stat-label">Active Projects</span>
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 2" />
            </svg>
          </span>
        </div>
        <div class="stat-value" data-count="17">0</div>
      </article>

      <!-- Recent Activity -->
      <article class="stat-card">
        <div class="stat-head">
          <span class="stat-label">Recent Activity</span>
          <span class="stat-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M3 12h4l3-7 4 14 3-7h4" />
            </svg>
          </span>
        </div>
        <div class="stat-value is-text">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span>System active</span>
        </div>
      </article>

    </section>

  </div>

<script>
  /* ============================================================
     NAV — Active state (functional, không nút giả)
     ============================================================ */
  (function () {
    const links = document.querySelectorAll(".nav-link");

    links.forEach((link) => {
      link.addEventListener("click", function (e) {
        // Chỉ đổi active state, giữ hành vi anchor mặc định (#home, #projects...)
        links.forEach((l) => l.classList.remove("is-active"));
        this.classList.add("is-active");
      });
    });
  })();

  /* ============================================================
     COUNTER ANIMATION cho 3 card số liệu
     (Card "Recent Activity" không có data-count → bỏ qua)
     ============================================================ */
  (function () {
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const counters = document.querySelectorAll(".stat-value[data-count]");

    if (prefersReduced) {
      counters.forEach((el) => {
        el.textContent = formatNumber(Number(el.dataset.count));
      });
      return;
    }

    counters.forEach((el) => {
      const target = Number(el.dataset.count);
      const duration = 1100;
      const start = performance.now();

      function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        // easeOutCubic
        const eased = 1 - Math.pow(1 - p, 3);
        const value = Math.round(target * eased);
        el.textContent = formatNumber(value);

        if (p < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = formatNumber(target);
        }
      }

      requestAnimationFrame(tick);
    });

    function formatNumber(n) {
      return n.toLocaleString("en-US");
    }
  })();
</script>
</body>
</html>
