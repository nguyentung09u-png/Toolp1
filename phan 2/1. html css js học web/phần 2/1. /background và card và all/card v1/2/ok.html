<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World Card — 02</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --card-w: min(440px, 90vw);
    --card-h: min(300px, 68vw);

    --cream: #f6f0e4;
    --cream-2: #efe6d4;
    --clay: #c96b4a;
    --clay-soft: rgba(201, 107, 74, 0.18);
    --ink: #2a241f;
    --ink-dim: #6b5f52;

    --shadow-deep: rgba(120, 90, 60, 0.22);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #efe7d8;
    color: var(--ink);
    font-family: 'Inter Tight', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 32px 20px;
    position: relative;
    isolation: isolate;
  }

  /* Ambient stage — tông giấy ấm */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(700px 500px at 15% 10%, rgba(255, 245, 220, 0.9), transparent 60%),
      radial-gradient(800px 600px at 85% 90%, rgba(201, 107, 74, 0.10), transparent 65%),
      linear-gradient(180deg, #f2ebdc 0%, #e8dec9 100%);
    z-index: -2;
  }

  /* Noise texture nhẹ kiểu giấy mỹ thuật */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0.28 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.12;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: -1;
  }

  /* ============ CARD STAGE ============ */
  .card-stage {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
  }

  /* Glow mềm phía sau — warm ambient */
  .card-glow {
    position: absolute;
    inset: -18px;
    background: radial-gradient(
      60% 70% at 40% 40%,
      rgba(201, 107, 74, 0.20),
      rgba(201, 107, 74, 0.05) 55%,
      transparent 75%
    );
    filter: blur(24px);
    opacity: 0.75;
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
    z-index: 0;
  }

  /* Card — organic blob shape */
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    z-index: 1;

    /* Blob shape mềm, asymmetric */
    border-radius: 42% 58% 47% 53% / 55% 46% 54% 45%;

    background:
      linear-gradient(145deg, var(--cream) 0%, var(--cream-2) 60%, #e7dbc4 100%);

    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 -20px 40px rgba(255,255,255,0.35) inset,
      0 20px 45px -15px var(--shadow-deep),
      0 8px 20px -8px rgba(120, 90, 60, 0.18);

    display: grid;
    place-items: center;
    overflow: hidden;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1),
                box-shadow 0.6s ease,
                border-radius 0.8s cubic-bezier(.2,.7,.2,1);

    animation: blobEnter 1.1s cubic-bezier(.2,.7,.2,1) both;
    will-change: transform, border-radius;
  }

  /* Inner frame mảnh — như khung vẽ tranh */
  .card::before {
    content: "";
    position: absolute;
    inset: 14px;
    border-radius: 42% 58% 47% 53% / 55% 46% 54% 45%;
    border: 1px solid rgba(201, 107, 74, 0.28);
    pointer-events: none;
    transition: border-color 0.5s ease, inset 0.5s ease;
  }

  /* Warm inner light từ góc trên phải */
  .card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      55% 50% at 78% 22%,
      rgba(255, 240, 210, 0.9),
      transparent 70%
    );
    pointer-events: none;
    mix-blend-mode: soft-light;
    opacity: 0.9;
  }

  /* Nội dung */
  .card-content {
    position: relative;
    z-index: 2;
    padding: 32px 44px;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    width: 100%;
  }

  .card-text {
    font-family: 'Fraunces', 'Times New Roman', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(30px, 7.2vw, 54px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    color: var(--ink);
    background: linear-gradient(160deg, #2a241f 0%, #4a3d33 60%, var(--clay) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1),
                letter-spacing 0.6s ease;
    animation: textEnter 1.15s 0.28s cubic-bezier(.2,.7,.2,1) both;
  }

  /* --- Hover: morph nhẹ blob, glow mở rộng --- */
  .card-stage:hover .card {
    transform: translateY(-6px) rotate(-0.4deg);
    border-radius: 55% 45% 52% 48% / 47% 53% 46% 54%;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 -20px 40px rgba(255,255,255,0.35) inset,
      0 26px 55px -15px var(--shadow-deep),
      0 10px 24px -8px rgba(120, 90, 60, 0.22);
  }
  .card-stage:hover .card-glow {
    opacity: 1;
    transform: scale(1.06);
  }
  .card-stage:hover .card::before {
    border-color: rgba(201, 107, 74, 0.55);
    inset: 16px;
  }
  .card-stage:hover .card-text {
    transform: translateY(-2px);
    letter-spacing: 0.005em;
  }

  @media (hover: none) {
    .card:active {
      transform: translateY(-3px) scale(0.995);
      border-radius: 55% 45% 52% 48% / 47% 53% 46% 54%;
    }
  }

  /* --- Entrance --- */
  @keyframes blobEnter {
    0% {
      opacity: 0;
      transform: scale(0.82) rotate(-4deg);
      border-radius: 60% 40% 50% 50% / 50% 60% 40% 50%;
    }
    60% {
      opacity: 1;
      transform: scale(1.02) rotate(0.4deg);
    }
    100% {
      opacity: 1;
      transform: scale(1) rotate(0);
      border-radius: 42% 58% 47% 53% / 55% 46% 54% 45%;
    }
  }

  .card-glow {
    animation: glowEnter 1.3s 0.1s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes glowEnter {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 0.75; transform: scale(1); }
  }

  @keyframes textEnter {
    0% { opacity: 0; transform: translateY(12px); filter: blur(5px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* --- Reduced motion --- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .card-stage:hover .card { transform: none; }
  }

  /* --- Responsive --- */
  @media (max-width: 480px) {
    :root {
      --card-h: min(260px, 72vw);
    }
    .card-content { padding: 24px 28px; }
    .card::before { inset: 10px; }
  }

  @media (min-width: 1024px) {
    :root {
      --card-w: 480px;
      --card-h: 320px;
    }
  }
</style>
</head>
<body>

  <div class="card-stage">
    <div class="card-glow" aria-hidden="true"></div>
    <div class="card" role="group" aria-label="Hello World card">
      <div class="card-content">
        <span class="card-text">Hello World</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Card không có chức năng tương tác — chỉ giữ logic tối thiểu.
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.reducedMotion = 'true';
      }
    })();
  </script>

</body>
</html>
