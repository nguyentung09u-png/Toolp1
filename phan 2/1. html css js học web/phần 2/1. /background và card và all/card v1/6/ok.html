<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World Card — 06</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
<style>
  :root {
    --card-w: min(520px, 92vw);
    --card-h: clamp(120px, 28vw, 180px);

    --ivory: #f7f2e8;
    --ivory-2: #ece4d4;
    --violet: #7a6a9c;
    --violet-soft: rgba(122, 106, 156, 0.14);
    --graphite: #2e2a3a;
    --ring: rgba(122, 106, 156, 0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #ece3d4;
    color: var(--graphite);
    font-family: system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 32px 20px;
    position: relative;
    isolation: isolate;
  }

  /* Ambient — ivory với violet bloom rất nhẹ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(700px 500px at 50% 30%, #fbf7ef 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 80%, rgba(122, 106, 156, 0.12), transparent 65%),
      linear-gradient(180deg, #f0e8da 0%, #e2d7c4 100%);
    z-index: -2;
  }

  /* Noise nhẹ */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.4  0 0 0 0 0.55  0 0 0 0.18 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.08;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: -1;
  }

  /* ============ CARD STAGE ============ */
  .card-stage {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    isolation: isolate;
  }

  /* Halo đồng tâm — 3 vòng */
  .card-halo {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    pointer-events: none;
    z-index: 0;
  }
  .card-halo.ring-1 {
    inset: -14px;
    border: 1px solid var(--ring);
    opacity: 0.7;
    animation: ringEnter 1.4s 0.15s cubic-bezier(.2,.7,.2,1) both;
  }
  .card-halo.ring-2 {
    inset: -30px;
    border: 1px solid rgba(122, 106, 156, 0.18);
    opacity: 0.55;
    animation: ringEnter 1.4s 0.30s cubic-bezier(.2,.7,.2,1) both;
  }
  .card-halo.ring-3 {
    inset: -48px;
    border: 1px solid rgba(122, 106, 156, 0.10);
    opacity: 0.4;
    animation: ringEnter 1.4s 0.45s cubic-bezier(.2,.7,.2,1) both;
  }

  /* Card — stadium (pill) shape */
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    background:
      radial-gradient(120% 80% at 30% 20%, rgba(255, 255, 255, 0.85), transparent 55%),
      linear-gradient(160deg, var(--ivory) 0%, var(--ivory-2) 70%, #e2d7c2 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(122, 106, 156, 0.10),
      0 22px 44px -18px rgba(58, 48, 82, 0.30),
      0 8px 18px -10px rgba(58, 48, 82, 0.20);
    display: grid;
    place-items: center;
    overflow: hidden;
    z-index: 1;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1),
                box-shadow 0.6s ease;
    animation: cardEnter 1.1s cubic-bezier(.2,.7,.2,1) both;
    will-change: transform;
  }

  /* Violet glass tint mảnh ở rìa */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(
      120% 100% at 50% 120%,
      rgba(122, 106, 156, 0.16),
      transparent 55%
    );
    pointer-events: none;
    opacity: 0.9;
  }

  /* Specular highlight mảnh chạy dọc trên */
  .card::after {
    content: "";
    position: absolute;
    top: 8px;
    left: 20%;
    right: 20%;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.9) 50%,
      transparent
    );
    pointer-events: none;
    opacity: 0.8;
  }

  /* Nội dung */
  .card-content {
    position: relative;
    z-index: 2;
    padding: 0 clamp(24px, 7%, 60px);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
    height: 100%;
  }

  .card-text {
    font-family: 'Cormorant Garamond', 'Times New Roman', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(34px, 7.6vw, 64px);
    line-height: 1;
    letter-spacing: -0.012em;
    color: var(--graphite);
    background: linear-gradient(
      175deg,
      #2e2a3a 0%,
      #4a3f5e 45%,
      #7a6a9c 100%
    );
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1),
                letter-spacing 0.6s ease;
    animation: textEnter 1.15s 0.30s cubic-bezier(.2,.7,.2,1) both;
  }

  /* --- Hover: ring nở ra, pill nâng nhẹ --- */
  .card-stage:hover .card {
    transform: translateY(-4px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.95),
      inset 0 -1px 0 rgba(122, 106, 156, 0.16),
      0 30px 55px -20px rgba(58, 48, 82, 0.40),
      0 12px 24px -10px rgba(58, 48, 82, 0.26);
  }
  .card-stage:hover .ring-1 {
    transform: scale(1.03);
    opacity: 1;
    border-color: rgba(122, 106, 156, 0.5);
  }
  .card-stage:hover .ring-2 {
    transform: scale(1.05);
    opacity: 0.75;
  }
  .card-stage:hover .ring-3 {
    transform: scale(1.07);
    opacity: 0.55;
  }
  .card-stage:hover .card-text {
    transform: translateY(-1px);
    letter-spacing: 0.002em;
  }

  @media (hover: none) {
    .card:active { transform: translateY(-2px); }
  }

  /* --- Entrance --- */
  @keyframes cardEnter {
    0% {
      opacity: 0;
      transform: scale(0.92);
      filter: blur(8px);
    }
    100% {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
    }
  }
  @keyframes ringEnter {
    0% {
      opacity: 0;
      transform: scale(0.7);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }
  @keyframes textEnter {
    0% { opacity: 0; transform: translateY(6px); filter: blur(6px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* --- Reduced motion --- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .card-stage:hover .card,
    .card-stage:hover .card-text,
    .card-stage:hover .ring-1,
    .card-stage:hover .ring-2,
    .card-stage:hover .ring-3 { transform: none; }
  }

  /* --- Responsive --- */
  @media (max-width: 480px) {
    :root {
      --card-h: clamp(100px, 26vw, 140px);
    }
    .card-halo.ring-2 { inset: -22px; }
    .card-halo.ring-3 { inset: -34px; }
    .card::after { left: 30%; right: 30%; }
  }

  @media (min-width: 1024px) {
    :root {
      --card-w: 560px;
      --card-h: 190px;
    }
  }
</style>
</head>
<body>

  <div class="card-stage">
    <span class="card-halo ring-3" aria-hidden="true"></span>
    <span class="card-halo ring-2" aria-hidden="true"></span>
    <span class="card-halo ring-1" aria-hidden="true"></span>
    <div class="card" role="group" aria-label="Hello World card">
      <div class="card-content">
        <span class="card-text">Hello World</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.reducedMotion = 'true';
      }
    })();
  </script>

</body>
</html>
