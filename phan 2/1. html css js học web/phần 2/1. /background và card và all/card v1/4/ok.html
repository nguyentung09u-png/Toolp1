<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hello World Card — 04</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --card-w: min(440px, 88vw);
    --card-h: min(290px, 66vw);

    --plum-deep: #2b1a2c;
    --plum-mid: #3a2339;
    --plum-soft: #4a2e47;
    --ink: #231a24;
    --lilac: #c9a8d6;
    --lilac-soft: rgba(201, 168, 214, 0.16);
    --warm-white: #f4ede4;

    --layer-offset: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #f0e7df;
    color: var(--ink);
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 32px 20px;
    position: relative;
    isolation: isolate;
  }

  /* Ambient — giấy ấm với plum glow nhẹ góc phải */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(800px 550px at 25% 20%, #fbf6ef 0%, transparent 60%),
      radial-gradient(700px 550px at 82% 88%, rgba(74, 46, 71, 0.20), transparent 65%),
      linear-gradient(170deg, #f4ede4 0%, #e8dcd0 100%);
    z-index: -2;
  }

  /* Noise nhẹ kiểu giấy mỹ thuật */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.42  0 0 0 0.22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.10;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: -1;
  }

  /* ============ CARD STAGE ============ */
  .card-stage {
    position: relative;
    width: var(--card-w);
    height: var(--card-h);
    perspective: 1000px;
  }

  /* Layer stack — 3 lớp */
  .card-layer {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    transform-origin: bottom right;
    transition: transform 0.65s cubic-bezier(.2,.7,.2,1),
                box-shadow 0.6s ease;
    pointer-events: none;
  }

  /* Lớp 1 (dưới cùng) — nhạt nhất */
  .card-layer.layer-back {
    background: linear-gradient(150deg, #e2d3de, #cbb8c9);
    box-shadow: 0 8px 18px -10px rgba(43, 26, 44, 0.35);
    transform: translate(2 * var(--layer-offset), 2 * var(--layer-offset)) rotate(0.6deg);
    opacity: 0.7;
    animation: layerEnter 1.0s 0.30s cubic-bezier(.2,.7,.2,1) both;
  }

  /* Lớp 2 (giữa) */
  .card-layer.layer-mid {
    background: linear-gradient(150deg, #8d6a92, #6e4f72);
    box-shadow: 0 10px 22px -10px rgba(43, 26, 44, 0.45);
    transform: translate(var(--layer-offset), var(--layer-offset)) rotate(0.3deg);
    animation: layerEnter 1.0s 0.18s cubic-bezier(.2,.7,.2,1) both;
  }

  /* Lớp 3 — Card chính (front) */
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(201, 168, 214, 0.28), transparent 55%),
      linear-gradient(160deg, var(--plum-mid) 0%, var(--plum-deep) 70%, #1e1220 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      inset 0 0 0 1px rgba(201, 168, 214, 0.14),
      0 22px 40px -18px rgba(43, 26, 44, 0.55),
      0 8px 18px -8px rgba(43, 26, 44, 0.35);
    overflow: hidden;
    display: grid;
    place-items: center;
    z-index: 3;
    transition: transform 0.65s cubic-bezier(.2,.7,.2,1),
                box-shadow 0.6s ease;
    animation: cardEnter 1.1s cubic-bezier(.2,.7,.2,1) both;
    will-change: transform;
  }

  /* Tab notch góc trên trái — như tab folder */
  .card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 40px;
    width: 46px;
    height: 14px;
    background: linear-gradient(180deg, var(--lilac), #a585b6);
    border-radius: 0 0 8px 8px;
    box-shadow: 0 2px 6px rgba(43, 26, 44, 0.35);
    opacity: 0.9;
    z-index: 4;
    transition: opacity 0.5s ease;
  }

  /* Inner subtle corner fold ở góc phải dưới */
  .card::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: 44px;
    height: 44px;
    background: linear-gradient(
      135deg,
      transparent 0%,
      transparent 50%,
      rgba(201, 168, 214, 0.22) 50%,
      rgba(201, 168, 214, 0.10) 100%
    );
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 2;
  }

  /* Nội dung — canh giữa dọc, trái ngang */
  .card-content {
    position: relative;
    z-index: 3;
    padding: clamp(24px, 6%, 42px) clamp(26px, 7%, 46px);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    height: 100%;
    width: 100%;
  }

  .card-text {
    font-family: 'Instrument Serif', 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(32px, 7.4vw, 56px);
    line-height: 1.02;
    letter-spacing: -0.018em;
    color: var(--warm-white);
    background: linear-gradient(165deg, #f7efe5 0%, #ded0e4 55%, #c9a8d6 120%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
    animation: textEnter 1.15s 0.24s cubic-bezier(.2,.7,.2,1) both;
  }

  /* --- Hover: card stack bung ra --- */
  .card-stage:hover .card {
    transform: translate(-6px, -8px) rotate(-0.6deg);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.10),
      inset 0 0 0 1px rgba(201, 168, 214, 0.28),
      0 30px 55px -20px rgba(43, 26, 44, 0.65),
      0 12px 24px -10px rgba(43, 26, 44, 0.40);
  }
  .card-stage:hover .layer-mid {
    transform: translate(calc(var(--layer-offset) + 4px), calc(var(--layer-offset) + 4px)) rotate(0.9deg);
  }
  .card-stage:hover .layer-back {
    transform: translate(calc(2 * var(--layer-offset) + 8px), calc(2 * var(--layer-offset) + 8px)) rotate(1.4deg);
    opacity: 0.85;
  }
  .card-stage:hover .card::before {
    opacity: 1;
  }
  .card-stage:hover .card-text {
    transform: translateY(-1.5px);
  }

  @media (hover: none) {
    .card:active { transform: translate(-2px, -3px) rotate(-0.3deg); }
  }

  /* --- Entrance --- */
  @keyframes cardEnter {
    0% {
      opacity: 0;
      transform: translateY(10px) scale(0.96);
      filter: blur(6px);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0);
    }
  }
  @keyframes layerEnter {
    0% {
      opacity: 0;
      transform: translate(0, 0) rotate(0deg);
    }
    100% {
      opacity: 1;
    }
  }
  @keyframes textEnter {
    0% { opacity: 0; transform: translateY(8px); filter: blur(5px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* --- Reduced motion --- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .card-stage:hover .card,
    .card-stage:hover .layer-mid,
    .card-stage:hover .layer-back {
      transform: none;
    }
  }

  /* --- Responsive --- */
  @media (max-width: 480px) {
    :root {
      --card-h: min(250px, 70vw);
      --layer-offset: 9px;
    }
    .card::before { left: 26px; width: 38px; height: 12px; }
    .card::after { width: 34px; height: 34px; }
    .card-content { padding: 22px 24px; }
  }

  @media (min-width: 1024px) {
    :root {
      --card-w: 480px;
      --card-h: 310px;
      --layer-offset: 14px;
    }
  }
</style>
</head>
<body>

  <div class="card-stage">
    <div class="card-layer layer-back" aria-hidden="true"></div>
    <div class="card-layer layer-mid" aria-hidden="true"></div>
    <div class="card" role="group" aria-label="Hello World card">
      <div class="card-content">
        <span class="card-text">Hello World</span>
      </div>
    </div>
  </div>

  <script>
    (function () {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.dataset.reducedMotion = 'true';
      }
    })();
  </script>

</body>
</html>
