<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sidebar — Bento Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #f5f0e8;
    --cream-2: #ede5d6;
    --cream-3: #e0d5c0;

    --terracotta: #d97757;
    --terracotta-dark: #b85f42;
    --terracotta-soft: rgba(217, 119, 87, 0.14);

    --olive: #7a8b5a;
    --olive-dark: #5e6e42;

    --charcoal: #1c1c1c;
    --charcoal-soft: #2a2a2a;

    --text: #1c1c1c;
    --text-soft: #4a4642;
    --text-mute: #8a8478;
    --text-dim: #c4bdae;

    --line: rgba(28, 28, 28, 0.1);

    --font-serif: "Instrument Serif", Georgia, serif;
    --font-sans: "Geist", system-ui, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, monospace;

    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  html, body {
    min-height: 100vh;
    margin: 0;
  }

  body {
    font-family: var(--font-sans);
    background: #2a2521;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    padding: 32px 24px;
    position: relative;
    overflow-x: hidden;
    display: flex;
    justify-content: flex-start;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* ============================================================
     BACKGROUND — warm dark + radial glow
     ============================================================ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(900px 700px at 20% 20%, rgba(217, 119, 87, 0.16), transparent 60%),
      radial-gradient(700px 600px at 90% 90%, rgba(122, 139, 90, 0.12), transparent 60%),
      linear-gradient(160deg, #2a2521 0%, #332d28 55%, #2a2521 100%);
  }

  /* grain */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ============================================================
     SIDEBAR SHELL — bento container
     ============================================================ */
  .sidebar {
    position: relative;
    z-index: 1;
    width: 320px;
    flex: 0 0 auto;
    background: var(--cream);
    border-radius: 28px;
    padding: 20px 18px;
    box-shadow:
      0 2px 0 rgba(255, 255, 255, 0.7) inset,
      0 -1px 0 var(--cream-3) inset,
      0 30px 60px -20px rgba(0, 0, 0, 0.5),
      0 15px 30px -10px rgba(0, 0, 0, 0.3);

    /* load */
    opacity: 0;
    transform: translateY(14px);
    animation: bentoIn 0.8s var(--ease-out) 0.1s forwards;
  }
  @keyframes bentoIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     HEADER
     ============================================================ */
  .sidebar-head {
    padding: 4px 6px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
  }

  .head-mark {
    width: 34px;
    height: 34px;
    flex: 0 0 auto;
    border-radius: 10px;
    background: var(--charcoal);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 10px -2px rgba(28, 28, 28, 0.3);
  }
  .head-mark svg {
    width: 18px;
    height: 18px;
    stroke: var(--cream);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .head-text {
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1 1 auto;
    min-width: 0;
  }
  .head-eyebrow {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--text-mute);
    line-height: 1;
  }
  .head-title {
    font-family: var(--font-serif);
    font-size: 22px;
    font-weight: 400;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.2px;
    margin-top: 2px;
  }
  .head-title em {
    font-style: italic;
    color: var(--terracotta);
  }

  .head-num {
    font-family: var(--font-serif);
    font-size: 20px;
    color: var(--text-mute);
    flex: 0 0 auto;
    font-style: italic;
  }

  /* ============================================================
     BENTO GRID — nav
     ============================================================ */
  .nav {
    list-style: none;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0;
    transition: grid-template-columns 0.5s var(--ease-out);
  }

  .nav-item {
    position: relative;
    /* mỗi item chiếm 1 ô mặc định */
    grid-column: span 1;
    transition: grid-column 0.5s var(--ease-out);
  }

  /* item active span 2 cột */
  .nav-item:has(.nav-link.is-active) {
    grid-column: span 2;
  }

  .nav-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px;
    min-height: 68px;
    text-decoration: none;
    color: var(--text-soft);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: var(--cream-2);
    border: 1px solid transparent;
    border-radius: 18px;
    width: 100%;
    text-align: left;
    overflow: hidden;
    isolation: isolate;
    transition:
      background 0.35s var(--ease-out),
      border-color 0.3s var(--ease-out),
      transform 0.35s var(--ease-spring),
      color 0.3s var(--ease-out),
      min-height 0.4s var(--ease-out);
  }

  /* top highlight line */
  .nav-link::before {
    content: "";
    position: absolute;
    top: 0;
    left: 14px;
    right: 14px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
    opacity: 0.6;
    border-radius: 1px;
  }

  /* icon */
  .bento-icon {
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text-mute);
    position: relative;
    z-index: 1;
    transition: color 0.3s ease, transform 0.4s var(--ease-spring);
  }
  .bento-icon svg {
    width: 100%;
    height: 100%;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* label wrapper */
  .bento-body {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
    flex: 1 1 auto;
    position: relative;
    z-index: 1;
  }
  .bento-label {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-soft);
    line-height: 1.15;
    letter-spacing: -0.1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 0;
    opacity: 0;
    transform: translateY(-4px);
    transition:
      max-height 0.4s var(--ease-spring),
      opacity 0.3s var(--ease-out) 0.1s,
      transform 0.4s var(--ease-out) 0.1s,
      color 0.3s ease;
  }
  .bento-sub {
    font-family: var(--font-serif);
    font-size: 13px;
    font-style: italic;
    color: var(--text-mute);
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 0;
    opacity: 0;
    transform: translateY(-4px);
    transition:
      max-height 0.5s var(--ease-spring) 0.05s,
      opacity 0.4s var(--ease-out) 0.15s,
      transform 0.5s var(--ease-out) 0.15s;
  }

  /* meta num dưới phải */
  .bento-num {
    position: absolute;
    bottom: 8px;
    right: 12px;
    font-family: var(--font-serif);
    font-size: 16px;
    font-style: italic;
    color: var(--text-dim);
    line-height: 1;
    transition: color 0.3s ease, opacity 0.3s ease;
    z-index: 1;
  }

  /* ---- Hover ---- */
  .nav-link:hover {
    background: var(--cream-3);
    transform: translateY(-2px);
    border-color: rgba(217, 119, 87, 0.2);
  }
  .nav-link:hover .bento-icon {
    color: var(--terracotta);
    transform: scale(1.08);
  }
  .nav-link:hover .bento-num {
    color: var(--terracotta);
  }

  /* ---- ACTIVE: ô nở rộng span 2, terracotta bg ---- */
  .nav-link.is-active {
    background: var(--terracotta);
    color: var(--cream);
    border-color: var(--terracotta-dark);
    padding: 16px 18px;
    min-height: 86px;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.2),
      0 8px 20px -6px rgba(217, 119, 87, 0.4);
  }
  .nav-link.is-active::before {
    opacity: 0.35;
  }
  .nav-link.is-active .bento-icon {
    color: var(--cream);
    transform: scale(1.1);
  }
  .nav-link.is-active .bento-label {
    max-height: 40px;
    opacity: 1;
    transform: translateY(0);
    color: var(--cream);
    font-size: 15px;
  }
  .nav-link.is-active .bento-sub {
    max-height: 30px;
    opacity: 1;
    transform: translateY(0);
    color: rgba(245, 240, 232, 0.75);
  }
  .nav-link.is-active .bento-num {
    color: rgba(245, 240, 232, 0.5);
    opacity: 0;
  }

  /* indicator dot góc trên phải active */
  .nav-link.is-active::after {
    content: "";
    position: absolute;
    top: 14px;
    right: 14px;
    width: 8px;
    height: 8px;
    background: var(--cream);
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(245, 240, 232, 0.25);
    animation: activeDotPulse 2s ease-in-out infinite;
  }
  @keyframes activeDotPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 3px rgba(245, 240, 232, 0.25); }
    50%      { transform: scale(1.15); box-shadow: 0 0 0 5px rgba(245, 240, 232, 0.15); }
  }

  /* ============================================================
     FOOTER — bento meta tile
     ============================================================ */
  .sidebar-foot {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--charcoal);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 1.2px;
    color: var(--cream);
    text-transform: uppercase;
  }
  .sidebar-foot .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .sidebar-foot .status::before {
    content: "";
    width: 6px;
    height: 6px;
    background: var(--olive);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--olive);
    animation: statusPulse 2s ease-in-out infinite;
  }
  @keyframes statusPulse {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .sidebar-foot .version {
    color: rgba(245, 240, 232, 0.5);
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */

  /* Tablet */
  @media (max-width: 900px) {
    .sidebar { width: 290px; padding: 18px 16px; }
    .nav { gap: 8px; }
    .nav-link { padding: 12px 12px; min-height: 62px; border-radius: 16px; }
    .nav-link.is-active { padding: 14px 16px; min-height: 80px; }
    .bento-icon { width: 22px; height: 22px; }
    .bento-label { font-size: 12px; }
    .nav-link.is-active .bento-label { font-size: 14px; }
    .head-title { font-size: 20px; }
  }

  /* Mobile — grid 3 cột icon-only + active span full */
  @media (max-width: 640px) {
    body {
      padding: 16px 12px;
      display: block;
    }

    .sidebar {
      width: 100%;
      border-radius: 24px;
      padding: 16px 14px;
    }

    .sidebar-head { padding: 2px 4px 14px; }
    .head-title { font-size: 20px; }

    /* mobile grid: 5 cột → active span 5? Không, dùng 5 cột đều nhưng active nở height */
    .nav {
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    /* reset item span về 1 cột trên mobile */
    .nav-item,
    .nav-item:has(.nav-link.is-active) {
      grid-column: span 1;
    }

    .nav-link {
      flex-direction: column;
      gap: 4px;
      padding: 12px 6px;
      min-height: 64px;
      border-radius: 14px;
      text-align: center;
    }

    .bento-icon { width: 22px; height: 22px; }

    /* label ẩn dạng text trên mobile — chỉ icon */
    .bento-body { display: none; }

    /* num hiển thị nhỏ dưới icon */
    .bento-num {
      position: static;
      font-size: 11px;
      margin-top: 2px;
      color: var(--text-mute);
    }

    /* active trên mobile: nở nhẹ + terracotta */
    .nav-link.is-active {
      padding: 12px 6px;
      min-height: 64px;
    }
    .nav-link.is-active .bento-num {
      color: rgba(245, 240, 232, 0.6);
      opacity: 1;
    }

    /* dot active nhỏ góc */
    .nav-link.is-active::after {
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
    }

    .sidebar-foot {
      padding: 10px 12px;
      font-size: 8.5px;
      margin-top: 12px;
    }
  }

  /* Android nhỏ */
  @media (max-width: 420px) {
    .nav-link {
      padding: 10px 4px;
      min-height: 58px;
      border-radius: 12px;
    }
    .nav-link.is-active { padding: 10px 4px; min-height: 58px; }
    .bento-icon { width: 20px; height: 20px; }
    .bento-num { font-size: 10px; }
    .head-title { font-size: 18px; }
  }

  /* ============================================================
     A11Y
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .sidebar { opacity: 1; transform: none; }
    .bento-label,
    .bento-sub {
      max-height: 40px;
      opacity: 1;
      transform: none;
    }
    .nav-link.is-active::after { animation: none; }
    .sidebar-foot .status::before { animation: none; }
  }

  :focus-visible {
    outline: 2px solid var(--terracotta);
    outline-offset: 2px;
    border-radius: 18px;
  }
</style>
</head>
<body>

  <aside class="sidebar" aria-label="Main navigation">

    <!-- HEADER -->
    <div class="sidebar-head">

        <svg viewBox="0 0 24 24">

    </ul>

    <!-- FOOTER -->
    <div class="sidebar-foot">

  </aside>

<script>
  /* ============================================================
     BENTO GRID — active state (grid reflow)
     ============================================================ */
  (function () {
    const links = document.querySelectorAll(".nav-link");
    const isMobile = () => window.matchMedia("(max-width: 640px)").matches;
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function activate(link) {
      links.forEach((l) => {
        l.classList.remove("is-active");
        l.setAttribute("aria-selected", "false");
      });
      link.classList.add("is-active");
      link.setAttribute("aria-selected", "true");

      // mobile: scroll active vào giữa
      if (isMobile() && !prefersReduced) {
        const nav = document.querySelector(".nav");
        const navRect = nav.getBoundingClientRect();
        const linkRect = link.getBoundingClientRect();
        const delta = (linkRect.left + linkRect.width / 2) - (navRect.left + navRect.width / 2);
        nav.scrollBy({ left: delta, behavior: "smooth" });
      }
    }

    links.forEach((link) => {
      link.addEventListener("click", function (e) {
        e.preventDefault();
        activate(this);
      });
    });
  })();
</script>
</body>
</html>
