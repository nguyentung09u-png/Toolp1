<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quý Tình Barber Shop - Bảng Giá Dịch Vụ</title>
  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <h1 class="shop-name">Quý Tình Barber Shop</h1>
      <p class="shop-slogan">Bảng Giá Dịch Vụ • Mở cửa: 8:00 - 18:00</p>
    </div>
  </header>

  <!-- BỘ LỌC DANH MỤC -->
  <nav class="filter-nav" id="filterNav">
    <button class="filter-btn active" data-category="all">Tất cả</button>
    <button class="filter-btn" data-category="dich-vu-le">Dịch Vụ Lẻ</button>
    <button class="filter-btn" data-category="combo-tiet-kiem">Combo Siêu Tiết Kiệm</button>
  </nav>

  <!-- LƯỚI DỊCH VỤ (GRID 2 CỘT) -->
  <main class="product-grid" id="productGrid">
    <!-- Card dịch vụ sẽ được render tự động bằng JS -->
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Quý Tình Barber Shop • Giờ mở cửa: 8:00 - 18:00</p>
    <p>Hotline đặt lịch: 0367 411 225</p>
  </footer>

  <!-- NÚT LIÊN HỆ ZALO (FAB) -->
  <a href="https://zalo.me/0367411225" target="_blank" class="fab-zalo" id="fabZalo">
    <img src="https://static.freepnglogo.com/images/all_img/zalo-icon-4635.png" alt="Zalo">
    <span>Đặt lịch Zalo</span>
  </a>

  <!-- Link JS -->
  <script src="script.js"></script>
</body>
</html>
