<!DOCTYPE html>

<head>

  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css">

<body>

    <button class="filter-btn" data-category="ca-phe">Cà Phê</button>

  <!-- LƯỚI SẢN PHẨM (GRID 2 CỘT) -->
  <main class="product-grid" id="productGrid">
    <!-- Card sản phẩm sẽ được render tự động bằng JS -->
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2024 Tiệm Nhà Sóc Nhím - Địa chỉ: 123 Đường ABC, TP.HCM</p>
    <p>Hotline: 0367 411 225</p>

  <!-- NÚT LIÊN HỆ ZALO (FAB) -->

    <img src="https://static.freepnglogo.com/images/all_img/zalo-icon-4635.png" alt="Zalo">

  <!-- Link JS -->
  <script src="script.js"></script>
