<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiệm Cà Phê - Hương Vị Đậm Đà</title>
  <!-- Font Be Vietnam Pro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Link CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-content">
      <h1 class="shop-name">Tiệm Cà Phê</h1>
      <p class="shop-slogan">Đậm vị phin Việt – Trọn vẹn từng khoảnh khắc</p>
    </div>
  </header>

  <!-- BỘ LỌC DANH MỤC -->
  <nav class="filter-nav" id="filterNav">
    <button class="filter-btn active" data-category="all">Tất cả</button>
    <button class="filter-btn" data-category="ca-phe-phin">Cà Phê Phin</button>
    <button class="filter-btn" data-category="freeze">Freeze</button>
    <button class="filter-btn" data-category="tra">Trà</button>
    <button class="filter-btn" data-category="espresso">Espresso</button>
    <button class="filter-btn" data-category="thuc-uong-khac">Thức Uống Khác</button>
    <button class="filter-btn" data-category="banh">Bánh</button>
  </nav>

  <!-- LƯỚI SẢN PHẨM (GRID 2 CỘT) -->
  <main class="product-grid" id="productGrid">
    <!-- Card sản phẩm sẽ được render tự động bằng JS -->
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Tiệm Cà Phê - Địa chỉ: 123 Đường ABC, TP.HCM</p>
    <p>Hotline đặt món: 0367 411 225</p>
  </footer>

  <!-- NÚT LIÊN HỆ ZALO (FAB) -->
  <a href="https://zalo.me/0367411225" target="_blank" class="fab-zalo" id="fabZalo">
    <img src="https://static.freepnglogo.com/images/all_img/zalo-icon-4635.png" alt="Zalo">
    <span>Đặt món Zalo</span>
  </a>

  <!-- Link JS -->
  <script src="script.js"></script>
</body>
</html>
