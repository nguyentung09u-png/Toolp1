<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Overlay - aovhub.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div id="monter-page-loader" role="status" aria-live="polite">
    <div class="ml-orbit-box">
      <div class="ml-ring-dashed"></div>
      <div class="ml-ring-arc"></div>
      <div class="ml-logo-wrap">
        <!-- Logo vương miện kim cương đa diện mới -->
        <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3CradialGradient id='glacierBg' cx='50%25' cy='35%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%231e3a8a'/%3E%3Cstop offset='100%25' stop-color='%230c1836'/%3E%3C/radialGradient%3E%3ClinearGradient id='iceBlue' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23e0f2fe'/%3E%3Cstop offset='50%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%230284c7'/%3E%3C/linearGradient%3E%3ClinearGradient id='coralPeak' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23f43f5e'/%3E%3Cstop offset='100%25' stop-color='%23fb923c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpolygon points='100,8 182,54 182,146 100,192 18,146 18,54' fill='url(%23glacierBg)'/%3E%3Cpolygon points='100,22 168,61 168,139 100,178 32,139 32,61' fill='none' stroke='%237dd3fc' stroke-opacity='0.28' stroke-width='1.5'/%3E%3Cpolygon points='100,44 134,94 100,154 66,94' fill='url(%23iceBlue)'/%3E%3Cpolygon points='100,44 134,94 100,106' fill='%23bae6fd'/%3E%3Cpolygon points='46,78 72,94 60,124' fill='url(%23coralPeak)'/%3E%3Cpolygon points='154,78 128,94 140,124' fill='url(%23coralPeak)'/%3E%3Ccircle cx='100' cy='96' r='8' fill='%23ffffff'/%3E%3C/svg%3E" alt="Logo aovhub.top">
      </div>
    </div>

    <h1 class="ml-domain">aovhub.top</h1>

    <div class="ml-pill">
      <span class="ml-pill-dot"></span>
      <span class="ml-pill-text">LOADING...</span>
    </div>

    <div class="ml-progress-track">
      <div class="ml-progress-bar" id="ml-progress-bar"></div>
    </div>

    <div class="ml-status" id="ml-status-text">Đang chuẩn bị giao diện</div>
  </div>

  <!-- NỘI DUNG SAU KHI LOAD XONG -->
  <div class="demo-content">
    <h2 style="margin: 0; font-size: 18px;">Giao diện chính đã sẵn sàng</h2>
    <button type="button" class="demo-btn" onclick="runLoaderDemo()">Chạy lại Loading Overlay</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
