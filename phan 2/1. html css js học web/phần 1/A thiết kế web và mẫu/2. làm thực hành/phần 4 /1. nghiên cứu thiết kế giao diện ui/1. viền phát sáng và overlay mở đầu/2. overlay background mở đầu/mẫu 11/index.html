<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Overlay - aovhub.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div id="monter-page-loader" role="status" aria-live="polite">
    <div class="ml-orbit-box">
      <div class="ml-ring-dashed"></div>
      <div class="ml-ring-arc"></div>
      <div class="ml-logo-wrap">
        <!-- Logo chữ lồng hình học kiến trúc mới -->
        <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='cardBase' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23231f1d'/%3E%3Cstop offset='100%25' stop-color='%2312100e'/%3E%3C/linearGradient%3E%3ClinearGradient id='vermilionGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23ff7b54'/%3E%3Cstop offset='55%25' stop-color='%23e04f33'/%3E%3Cstop offset='100%25' stop-color='%23b93118'/%3E%3C/linearGradient%3E%3ClinearGradient id='champagneGrad' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23d49b35'/%3E%3Cstop offset='100%25' stop-color='%23fde68a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' rx='44' fill='url(%23cardBase)'/%3E%3Crect x='14' y='14' width='172' height='172' rx='34' fill='none' stroke='%23f6f3ec' stroke-opacity='0.14' stroke-width='1.5'/%3E%3Cpath d='M100 36 L152 152 L124 152 L100 94 L76 152 L48 152 Z' fill='url(%23vermilionGrad)'/%3E%3Cpath d='M64 124 L136 124 L126 144 L74 144 Z' fill='url(%23champagneGrad)'/%3E%3Ccircle cx='100' cy='54' r='6' fill='%23f6f3ec'/%3E%3C/svg%3E" alt="Logo aovhub.top">
      </div>
    </div>

    <h1 class="ml-domain">aovhub.top</h1>

    <div class="ml-pill">
      <span class="ml-pill-dot"></span>
      <span class="ml-pill-text">LOADING...</span>
    </div>

    <div class="ml-progress-track">
      <div class="ml-progress-bar" id="ml-progress-bar"></div>
    </div>

    <div class="ml-status" id="ml-status-text">Đang chuẩn bị giao diện</div>
  </div>

  <!-- NỘI DUNG SAU KHI LOAD XONG -->
  <div class="demo-content">
    <h2 style="margin: 0; font-size: 18px;">Giao diện chính đã sẵn sàng</h2>
    <button type="button" class="demo-btn" onclick="runLoaderDemo()">Chạy lại Loading Overlay</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
