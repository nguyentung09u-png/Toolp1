<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Overlay - aovhub.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div id="monter-page-loader" role="status" aria-live="polite">
    <div class="ml-orbit-box">
      <div class="ml-ring-dashed"></div>
      <div class="ml-ring-arc"></div>
      <div class="ml-logo-wrap">
        <!-- Logo ảnh biểu tượng nhật thực & mũi nhọn đôi mới -->
        <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3CradialGradient id='mossBg' cx='50%25' cy='38%25' r='62%25'%3E%3Cstop offset='0%25' stop-color='%232c4c38'/%3E%3Cstop offset='100%25' stop-color='%23132219'/%3E%3C/radialGradient%3E%3ClinearGradient id='ochreSun' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fde68a'/%3E%3Cstop offset='55%25' stop-color='%23d97706'/%3E%3Cstop offset='100%25' stop-color='%239a3412'/%3E%3C/linearGradient%3E%3ClinearGradient id='sageBlade' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%236ee7b7'/%3E%3Cstop offset='100%25' stop-color='%23ecfdf5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='100' cy='100' r='98' fill='url(%23mossBg)'/%3E%3Ccircle cx='100' cy='76' r='34' fill='url(%23ochreSun)'/%3E%3Ccircle cx='100' cy='70' r='26' fill='%23182b20'/%3E%3Cpath d='M36 144 L86 58 L100 92 L72 144 Z' fill='url(%23sageBlade)'/%3E%3Cpath d='M164 144 L114 58 L100 92 L128 144 Z' fill='%23a7f3d0'/%3E%3Cpolygon points='100,98 118,144 82,144' fill='%23d97706'/%3E%3Ccircle cx='100' cy='100' r='84' fill='none' stroke='%23d97706' stroke-width='1.5' stroke-opacity='0.45'/%3E%3C/svg%3E" alt="Logo aovhub.top">
      </div>
    </div>

    <h1 class="ml-domain">aovhub.top</h1>

    <div class="ml-pill">
      <span class="ml-pill-dot"></span>
      <span class="ml-pill-text">LOADING...</span>
    </div>

    <div class="ml-progress-track">
      <div class="ml-progress-bar" id="ml-progress-bar"></div>
    </div>

    <div class="ml-status" id="ml-status-text">Đang chuẩn bị giao diện</div>
  </div>

  <!-- NỘI DUNG SAU KHI LOAD XONG -->
  <div class="demo-content">
    <h2 style="margin: 0; font-size: 18px;">Giao diện chính đã sẵn sàng</h2>
    <button type="button" class="demo-btn" onclick="runLoaderDemo()">Chạy lại Loading Overlay</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
