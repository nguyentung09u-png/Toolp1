<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Overlay - aovhub.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div id="monter-page-loader" role="status" aria-live="polite">
    <div class="ml-orbit-box">
      <div class="ml-ring-dashed"></div>
      <div class="ml-ring-arc"></div>
      <div class="ml-logo-wrap">
        <!-- Logo ảnh biểu tượng cánh chim hình học đa diện mới -->
        <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3CradialGradient id='graphiteBg' cx='50%25' cy='38%25' r='62%25'%3E%3Cstop offset='0%25' stop-color='%23272b38'/%3E%3Cstop offset='100%25' stop-color='%23101218'/%3E%3C/radialGradient%3E%3ClinearGradient id='wingAzure' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23bae6fd'/%3E%3Cstop offset='50%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3ClinearGradient id='wingViolet' x1='100%25' y1='0%25' x2='0%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23f5d0fe'/%3E%3Cstop offset='50%25' stop-color='%23c084fc'/%3E%3Cstop offset='100%25' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='100' cy='100' r='98' fill='url(%23graphiteBg)'/%3E%3Ccircle cx='100' cy='100' r='84' fill='none' stroke='%23e2e8f0' stroke-width='1.2' stroke-opacity='0.22'/%3E%3Cpolygon points='34,62 96,86 78,106' fill='url(%23wingAzure)'/%3E%3Cpolygon points='166,62 104,86 122,106' fill='url(%23wingViolet)'/%3E%3Cpolygon points='52,102 98,96 86,124' fill='%237dd3fc'/%3E%3Cpolygon points='148,102 102,96 114,124' fill='%23d8b4fe'/%3E%3Cpolygon points='100,44 116,92 100,156 84,92' fill='%23f8fafc'/%3E%3Cpolygon points='100,44 116,92 100,104' fill='%23cbd5e1'/%3E%3Ccircle cx='100' cy='92' r='5.5' fill='%2338bdf8'/%3E%3C/svg%3E" alt="Logo aovhub.top">
      </div>
    </div>

    <h1 class="ml-domain">aovhub.top</h1>

    <div class="ml-pill">
      <span class="ml-pill-dot"></span>
      <span class="ml-pill-text">LOADING...</span>
    </div>

    <div class="ml-progress-track">
      <div class="ml-progress-bar" id="ml-progress-bar"></div>
    </div>

    <div class="ml-status" id="ml-status-text">Đang chuẩn bị giao diện</div>
  </div>

  <!-- NỘI DUNG SAU KHI LOAD XONG -->
  <div class="demo-content">
    <h2 style="margin: 0; font-size: 18px;">Giao diện chính đã sẵn sàng</h2>
    <button type="button" class="demo-btn" onclick="runLoaderDemo()">Chạy lại Loading Overlay</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
