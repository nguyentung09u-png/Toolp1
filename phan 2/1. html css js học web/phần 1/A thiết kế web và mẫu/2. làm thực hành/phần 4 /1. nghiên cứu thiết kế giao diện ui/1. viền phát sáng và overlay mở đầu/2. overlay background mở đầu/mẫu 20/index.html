<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Overlay - aovhub.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
 <style>
* {
  box-sizing: border-box;
  font-family: 'Be Vietnam Pro', system-ui, -apple-system, sans-serif;
}

html, body {
  margin: 0;
  padding: 0;
  background: #0b1523;
  color: #f8fafc;
  -webkit-font-smoothing: antialiased;
}

/* OVERLAY TOÀN MÀN HÌNH — ĐÊM TINH TÚ ART DECO & HỔ PHÁCH */
#monter-page-loader {
  position: fixed;
  inset: 0;
  z-index: 99999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background-color: #0b1523;
  background-image:
    radial-gradient(ellipse 65% 48% at 50% 34%, rgba(56, 189, 248, 0.14) 0%, transparent 58%),
    radial-gradient(circle at 78% 76%, rgba(251, 146, 60, 0.12) 0%, transparent 46%),
    radial-gradient(rgba(253, 230, 138, 0.14) 1px, transparent 1px),
    linear-gradient(180deg, #132338 0%, #08101b 100%);
  background-size: 100% 100%, 100% 100%, 34px 34px, 100% 100%;
  transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.38s ease;
  will-change: opacity;
  user-select: none;
}

#monter-page-loader.is-hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* KHUNG KHIÊN HIỆP SĨ VÁT NHỌN ĐÁY (HEATER SHIELD CREST) */
.ml-orbit-box {
  position: relative;
  width: 172px;
  height: 194px;
  display: grid;
  place-items: center;
  margin-bottom: 22px;
}

/* Lớp viền ngoài hình khiên nhịp thở ánh vàng */
.ml-ring-dashed {
  position: absolute;
  inset: 0;
  clip-path: polygon(10% 4%, 90% 4%, 94% 52%, 50% 98%, 6% 52%);
  background: linear-gradient(160deg, rgba(251, 191, 36, 0.45), rgba(56, 189, 248, 0.35));
  animation: ml-shield-float 3.2s ease-in-out infinite alternate;
  will-change: transform;
}

.ml-ring-dashed::before {
  content: "";
  position: absolute;
  inset: 2px;
  clip-path: polygon(10% 4%, 90% 4%, 94% 52%, 50% 98%, 6% 52%);
  background: #0e1b2d;
}

/* Lớp viền phát sáng cam hổ phách - xanh thiên thanh */
.ml-ring-arc {
  position: absolute;
  inset: 10px;
  clip-path: polygon(10% 4%, 90% 4%, 94% 52%, 50% 98%, 6% 52%);
  background: linear-gradient(155deg, #fbbf24 0%, #f97316 50%, #38bdf8 100%);
  animation: ml-shield-glow 2.2s ease-in-out infinite alternate;
  will-change: transform, opacity;
}

/* Khung chứa ảnh Shiba Inu Pháp Sư */
.ml-logo-wrap {
  position: relative;
  width: 144px;
  height: 164px;
  clip-path: polygon(10% 4%, 90% 4%, 94% 52%, 50% 98%, 6% 52%);
  background: #09121e;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  filter: drop-shadow(0 18px 28px rgba(4, 9, 17, 0.65));
}

.ml-logo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Tên miền aovhub.top */
.ml-domain {
  margin: 0 0 14px;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: -0.025em;
  background: linear-gradient(90deg, #ffffff 12%, #fde68a 54%, #fb923c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

/* Pill • LOADING... */
.ml-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 18px;
  border-radius: 10px;
  background: rgba(19, 35, 56, 0.88);
  border: 1px solid rgba(251, 191, 36, 0.28);
  box-shadow: 0 8px 20px rgba(4, 9, 17, 0.45);
  backdrop-filter: blur(8px);
  margin-bottom: 18px;
}

.ml-pill-dot {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  transform: rotate(45deg);
  background: #fbbf24;
  box-shadow: 0 0 10px #fbbf24;
  animation: ml-pulse 1.3s ease-in-out infinite;
}

.ml-pill-text {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: #fef3c7;
  text-transform: uppercase;
}

/* Thanh tiến trình */
.ml-progress-track {
  width: min(264px, 72vw);
  height: 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(251, 191, 36, 0.24);
  padding: 1px;
  overflow: hidden;
  margin-bottom: 12px;
}

.ml-progress-bar {
  width: 100%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #2563eb 0%, #38bdf8 48%, #fb923c 100%);
  box-shadow: 0 0 12px rgba(251, 191, 36, 0.55);
  transform-origin: left center;
  transform: scaleX(0.18);
  transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Dòng trạng thái bên dưới */
.ml-status {
  font-size: 12.5px;
  font-weight: 500;
  color: #93c5fd;
  letter-spacing: 0.01em;
}

@keyframes ml-shield-float {
  0% { transform: translateY(0px) scale(0.98); }
  100% { transform: translateY(-4px) scale(1.02); }
}

@keyframes ml-shield-glow {
  0% { opacity: 0.8; }
  100% { opacity: 1; }
}

@keyframes ml-pulse {
  0%, 100% { opacity: 0.45; transform: rotate(45deg) scale(0.85); }
  50% { opacity: 1; transform: rotate(45deg) scale(1.2); }
}

/* Giao diện test sau khi load xong */
.demo-content {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
  padding: 20px;
}

.demo-btn {
  padding: 12px 24px;
  border-radius: 10px;
  border: 1px solid rgba(251, 191, 36, 0.45);
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(249, 115, 22, 0.24));
  color: #fef3c7;
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 0.01em;
  cursor: pointer;
  box-shadow: 0 10px 24px -6px rgba(4, 9, 17, 0.5);
  transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
}

.demo-btn:hover {
  border-color: #fde68a;
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.36), rgba(249, 115, 22, 0.36));
}

.demo-btn:active {
  transform: scale(0.97);
}

  </style>
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div id="monter-page-loader" role="status" aria-live="polite">
    <div class="ml-orbit-box">
      <div class="ml-ring-dashed"></div>
      <div class="ml-ring-arc"></div>
      <div class="ml-logo-wrap">
        <!-- Logo minh họa Anime Chibi Shiba Inu Pháp Sư Tinh Tú mới -->
        <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 220 240'%3E%3Cdefs%3E%3CradialGradient id='starBg' cx='50%25' cy='38%25' r='64%25'%3E%3Cstop offset='0%25' stop-color='%231d3557'/%3E%3Cstop offset='100%25' stop-color='%2309121e'/%3E%3C/radialGradient%3E%3ClinearGradient id='shibaFur' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fb923c'/%3E%3Cstop offset='60%25' stop-color='%23ea580c'/%3E%3Cstop offset='100%25' stop-color='%23c2410c'/%3E%3C/linearGradient%3E%3ClinearGradient id='wizardHat' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='50%25' stop-color='%232563eb'/%3E%3Cstop offset='100%25' stop-color='%231e3a8a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='220' height='240' fill='url(%23starBg)'/%3E%3C!-- Vòng tròn ma thuật & ngôi sao nền --%3E%3Ccircle cx='110' cy='124' r='74' fill='none' stroke='%23fde68a' stroke-width='1.5' stroke-dasharray='4 5' stroke-opacity='0.45'/%3E%3Ccircle cx='44' cy='58' r='2.5' fill='%23fde047'/%3E%3Ccircle cx='178' cy='66' r='3' fill='%2338bdf8'/%3E%3Ccircle cx='48' cy='168' r='2' fill='%23ffffff'/%3E%3Ccircle cx='172' cy='162' r='2.5' fill='%23fde047'/%3E%3C!-- Áo choàng pháp sư xanh coban viền vàng --%3E%3Cpath d='M58 214 C62 176, 158 176, 162 214 Z' fill='url(%23wizardHat)' stroke='%2309121e' stroke-width='3'/%3E%3Cpath d='M78 182 L110 202 L142 182' fill='none' stroke='%23fbbf24' stroke-width='3.5' stroke-linecap='round'/%3E%3C!-- Tai Shiba trái & phải --%3E%3Cpath d='M62 114 L54 74 L88 94 Z' fill='url(%23shibaFur)' stroke='%2309121e' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M66 106 L62 84 L80 96 Z' fill='%23fef3c7'/%3E%3Cpath d='M158 114 L166 74 L132 94 Z' fill='url(%23shibaFur)' stroke='%2309121e' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M154 106 L158 84 L140 96 Z' fill='%23fef3c7'/%3E%3C!-- Khuôn mặt Shiba Chibi bầu bĩnh --%3E%3Cpath d='M56 132 C56 92, 164 92, 164 132 C164 166, 138 182, 110 182 C82 182, 56 166, 56 132 Z' fill='url(%23shibaFur)' stroke='%2309121e' stroke-width='3'/%3E%3C!-- Phần lông má & mõm trắng kem --%3E%3Cpath d='M58 136 C74 132, 92 142, 110 136 C128 142, 146 132, 162 136 C160 166, 136 180, 110 180 C84 180, 60 166, 58 136 Z' fill='%23fffbeb'/%3E%3C!-- Đôi mắt Anime long lanh & lông mày trắng đặc trưng Shiba --%3E%3Cellipse cx='88' cy='116' rx='6' ry='3.5' fill='%23fffbeb'/%3E%3Cellipse cx='132' cy='116' rx='6' ry='3.5' fill='%23fffbeb'/%3E%3Cellipse cx='88' cy='132' rx='8.5' ry='10' fill='%2309121e'/%3E%3Ccircle cx='85' cy='128' r='3.5' fill='%23ffffff'/%3E%3Ccircle cx='91' cy='135' r='1.8' fill='%2338bdf8'/%3E%3Cellipse cx='132' cy='132' rx='8.5' ry='10' fill='%2309121e'/%3E%3Ccircle cx='129' cy='128' r='3.5' fill='%23ffffff'/%3E%3Ccircle cx='135' cy='135' r='1.8' fill='%2338bdf8'/%3E%3C!-- Má hồng, mũi & nụ cười --%3E%3Cellipse cx='72' cy='146' rx='7' ry='4' fill='%23fda4af'/%3E%3Cellipse cx='148' cy='146' rx='7' ry='4' fill='%23fda4af'/%3E%3Cellipse cx='110' cy='146' rx='5.5' ry='4' fill='%2309121e'/%3E%3Cpath d='M99 155 Q104.5 162 110 155 Q115.5 162 121 155' fill='none' stroke='%2309121e' stroke-width='2.8' stroke-linecap='round'/%3E%3C!-- Mũ pháp sư chóp nhọn đính sao vàng --%3E%3Cellipse cx='110' cy='92' rx='64' ry='14' fill='url(%23wizardHat)' stroke='%2309121e' stroke-width='3'/%3E%3Cpath d='M72 90 L108 26 L132 42 L124 54 L146 90 Z' fill='url(%23wizardHat)' stroke='%2309121e' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M75 84 Q110 92 145 84' fill='none' stroke='%23fbbf24' stroke-width='4.5'/%3E%3Cpolygon points='106,58 109,65 116,65 110,70 112,77 106,72 100,77 102,70 96,65 103,65' fill='%23fde047'/%3E%3C/svg%3E" alt="Logo Anime Shiba Pháp Sư Tinh Tú">
      </div>
    </div>

    <h1 class="ml-domain">aovhub.top</h1>

    <div class="ml-pill">
      <span class="ml-pill-dot"></span>
      <span class="ml-pill-text">LOADING...</span>
    </div>

    <div class="ml-progress-track">
      <div class="ml-progress-bar" id="ml-progress-bar"></div>
    </div>

    <div class="ml-status" id="ml-status-text">Đang chuẩn bị giao diện</div>
  </div>

  <!-- NỘI DUNG SAU KHI LOAD XONG -->
  <div class="demo-content">
    <h2 style="margin: 0; font-size: 18px;">Giao diện chính đã sẵn sàng</h2>
    <button type="button" class="demo-btn" onclick="runLoaderDemo()">Chạy lại Loading Overlay</button>
  </div>

  <script>
(function () {
  const loader = document.getElementById('monter-page-loader');
  const bar = document.getElementById('ml-progress-bar');
  const statusText = document.getElementById('ml-status-text');

  function setProgress(ratio, text) {
    if (bar) bar.style.transform = `scaleX(${Math.max(0.05, Math.min(1, ratio))})`;
    if (text && statusText) statusText.textContent = text;
  }

  function hideLoader() {
    setProgress(1, 'Hoàn tất');
    setTimeout(() => {
      if (loader) loader.classList.add('is-hidden');
    }, 220);
  }

  window.runLoaderDemo = function () {
    if (!loader) return;
    loader.classList.remove('is-hidden');
    setProgress(0.18, 'Đang chuẩn bị giao diện');

    setTimeout(() => setProgress(0.48, 'Đang tải tài nguyên...'), 350);
    setTimeout(() => setProgress(0.82, 'Đang đồng bộ hệ thống...'), 750);
    setTimeout(() => hideLoader(), 1200);
  };

  // Chạy hiệu ứng khi mở trang
  runLoaderDemo();
})();

  </script>
</body>
</html>
