<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading Overlay - aovhub.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- OVERLAY LOADING -->
  <div id="monter-page-loader" role="status" aria-live="polite">
    <div class="ml-orbit-box">
      <div class="ml-ring-dashed"></div>
      <div class="ml-ring-arc"></div>
      <div class="ml-logo-wrap">
        <!-- Logo hoa sen mặt trời ánh kim mới -->
        <img src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 220'%3E%3Cdefs%3E%3ClinearGradient id='plumPortal' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232d1838'/%3E%3Cstop offset='100%25' stop-color='%23120918'/%3E%3C/linearGradient%3E%3ClinearGradient id='sunsetGold' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23fde68a'/%3E%3Cstop offset='50%25' stop-color='%23fb923c'/%3E%3Cstop offset='100%25' stop-color='%23f43f5e'/%3E%3C/linearGradient%3E%3ClinearGradient id='peachLight' x1='0%25' y1='100%25' x2='0%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%23fda4af'/%3E%3Cstop offset='100%25' stop-color='%23fff1f2'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='220' rx='90' fill='url(%23plumPortal)'/%3E%3Crect x='12' y='12' width='156' height='196' rx='78' fill='none' stroke='%23fdba74' stroke-opacity='0.32' stroke-width='1.5'/%3E%3Ccircle cx='90' cy='86' r='28' fill='url(%23sunsetGold)'/%3E%3Cpath d='M90 48 C106 74, 108 106, 90 134 C72 106, 74 74, 90 48 Z' fill='url(%23peachLight)'/%3E%3Cpath d='M50 96 C74 96, 86 114, 90 138 C68 134, 54 118, 50 96 Z' fill='url(%23sunsetGold)'/%3E%3Cpath d='M130 96 C106 96, 94 114, 90 138 C112 134, 126 118, 130 96 Z' fill='url(%23sunsetGold)'/%3E%3Cpolygon points='90,146 108,164 90,178 72,164' fill='%23fde68a'/%3E%3C/svg%3E" alt="Logo aovhub.top">
      </div>
    </div>

    <h1 class="ml-domain">aovhub.top</h1>

    <div class="ml-pill">
      <span class="ml-pill-dot"></span>
      <span class="ml-pill-text">LOADING...</span>
    </div>

    <div class="ml-progress-track">
      <div class="ml-progress-bar" id="ml-progress-bar"></div>
    </div>

    <div class="ml-status" id="ml-status-text">Đang chuẩn bị giao diện</div>
  </div>

  <!-- NỘI DUNG SAU KHI LOAD XONG -->
  <div class="demo-content">
    <h2 style="margin: 0; font-size: 18px;">Giao diện chính đã sẵn sàng</h2>
    <button type="button" class="demo-btn" onclick="runLoaderDemo()">Chạy lại Loading Overlay</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
